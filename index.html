// ─── HOOKS ───────────────────────────────────────────────────────────────────
function useDebounce(val, ms) {
  const [d, setD] = useState(val);
  useEffect(() => { const t = setTimeout(() => setD(val), ms); return () => clearTimeout(t); }, [val, ms]);
  return d;
}

function useFavs() {
  const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem('ltb_favs')||'[]'); } catch { return []; }});
  const toggle = useCallback(id => {
    setFavs(prev => {
      const next = prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id];
      localStorage.setItem('ltb_favs', JSON.stringify(next));
      return next;
    });
  }, []);
  return [favs, toggle];
}

// ─── SHARED UI ────────────────────────────────────────────────────────────────

}

function Btn({ children, variant='primary', onClick, style={}, color=PRIMARY, radius=14, disabled=false, type='button' }) {
  const [hov, setHov] = useState(false);
  const base = { border:'none', borderRadius:radius, padding:'11px 24px', fontSize:14, fontWeight:700, fontFamily:"'Nunito',sans-serif", transition:'all 0.15s', display:'inline-flex', alignItems:'center', gap:8, opacity:disabled?0.55:1, cursor:disabled?'not-allowed':'pointer', ...style };
  const up = () => { setHov(false); };
  if (variant==='primary') return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:color, color:'#fff', boxShadow:hov&&!disabled?`0 6px 22px ${color}55`:'none', transform:hov&&!disabled?'translateY(-1px)':'none'}}>{children}</button>;
  if (variant==='outline') return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:hov?'#f5f5f5':'#fff', color:'#333', border:'1.5px solid #ddd'}}>{children}</button>;
  if (variant==='ghost')   return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:'transparent', color:hov?color:'#666', padding:'8px 14px'}}>{children}</button>;
}

function Modal({ open, onClose, children, title }) {
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; return () => { document.body.style.overflow = ''; }; }, [open]);
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:20, backdropFilter:'blur(6px)', animation:'fadeIn 0.2s ease' }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:'#fff', borderRadius:24, padding:36, width:'100%', maxWidth:500, boxShadow:'0 28px 70px rgba(0,0,0,0.2)', maxHeight:'90vh', overflowY:'auto', animation:'popIn 0.25s ease' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:24 }}>
          <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:22 }}>{title}</h2>
          <button onClick={onClose} style={{ background:'#f2f2f0', border:'none', borderRadius:99, width:34, height:34, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Toast({ msg, type='success', onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3200); return () => clearTimeout(t); }, []);
  const icon = type==='success' ? '✅' : type==='error' ? '❌' : 'ℹ️';
  return (
    <div style={{ position:'fixed', bottom:32, left:'50%', transform:'translateX(-50%)', background:'#1c1a17', color:'#fff', borderRadius:99, padding:'13px 26px', fontWeight:700, fontSize:14, fontFamily:"'Nunito',sans-serif", zIndex:2000, boxShadow:'0 10px 40px rgba(0,0,0,0.35)', display:'flex', alignItems:'center', gap:10, whiteSpace:'nowrap', animation:'slideUp 0.3s ease' }}>
      <span style={{ fontSize:18 }}>{icon}</span> {msg}
    </div>
  );
}

  );
}

// ─── OPSLAG PAGE ──────────────────────────────────────────────────────────────
function OpslagPage({ listings, loading, setPage, setActiveListing, favs, toggleFav }) {
  const [filter, setFilter] = useState('alle');
  const [search, setSearch] = useState('');
  const [city, setCity]     = useState('alle');
  const [sort, setSort]     = useState('newest');
  const dSearch = useDebounce(search, 180);

  const filtered = useMemo(() => {
    let r = listings.filter(l => {
      const matchType   = filter==='alle' || l.type===filter;
      const matchCity   = city==='alle'   || l.city===city;
      const matchSearch = !dSearch || l.title.toLowerCase().includes(dSearch.toLowerCase()) || (l.institution_name||'').toLowerCase().includes(dSearch.toLowerCase());
      return matchType && matchCity && matchSearch;
    });
    if (sort==='newest')     r = [...r].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    if (sort==='price-asc')  r = [...r].sort((a,b)=>(a.price||0)-(b.price||0));
    if (sort==='price-desc') r = [...r].sort((a,b)=>(b.price||0)-(a.price||0));
    if (sort==='bids')       r = [...r].sort((a,b)=>(b.bid_count||0)-(a.bid_count||0));
    return r;
  }, [listings, filter, city, dSearch, sort]);

  return (
    <div style={{ minHeight:'100vh', paddingTop:68, background:'#fffcf8' }}>
      <div style={{ position:'sticky', top:68, zIndex:400, background:'rgba(255,252,248,0.97)', borderBottom:'1px solid #f0eeeb', backdropFilter:'blur(14px)', padding:'14px 24px' }}>
        <div style={{ maxWidth:1140, margin:'0 auto', display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
          <div style={{ flex:'1 1 220px', background:'#f5f4f2', borderRadius:12, display:'flex', alignItems:'center', padding:'10px 16px', gap:10, border:'1.5px solid #eceae6' }}>
            <span style={{ color:'#bbb', fontSize:16 }}>🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Søg i opslag..." style={{ border:'none', background:'transparent', outline:'none', fontSize:14, fontFamily:"'Nunito Sans',sans-serif", flex:1 }} />
            {search && <button onClick={()=>setSearch('')} style={{ border:'none', background:'none', color:'#bbb', fontSize:15 }}>✕</button>}
          </div>
          <div style={{ display:'flex', gap:6 }}>
            {['alle','køb','byd','byt'].map(f => (
              <button key={f} onClick={()=>setFilter(f)} style={{ padding:'9px 18px', borderRadius:99, border:filter===f?'none':'1.5px solid #ddd', background:filter===f?PRIMARY:'#fff', color:filter===f?'#fff':'#555', fontSize:13, fontWeight:700, fontFamily:"'Nunito',sans-serif", transition:'all 0.15s', textTransform:'capitalize', whiteSpace:'nowrap' }}>{f}</button>
            ))}
          </div>
          <select value={city} onChange={e=>setCity(e.target.value)} style={{ padding:'10px 14px', borderRadius:12, border:'1.5px solid #eceae6', fontSize:14, background:'#f5f4f2', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }}>
            {CITIES.map(c=><option key={c} value={c}>{c==='alle'?'Alle byer':c}</option>)}
          </select>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{ padding:'10px 14px', borderRadius:12, border:'1.5px solid #eceae6', fontSize:14, background:'#f5f4f2', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }}>
            <option value="newest">Nyeste først</option>
            <option value="price-asc">Pris: lav → høj</option>
            <option value="price-desc">Pris: høj → lav</option>
            <option value="bids">Flest bud</option>
          </select>
        </div>
      </div>

      <div style={{ maxWidth:1140, margin:'0 auto', padding:'28px 24px' }}>
        <p style={{ color:'#999', fontSize:14, marginBottom:22 }}>
          {loading ? 'Henter opslag…' : `${filtered.length} opslag fundet`}{dSearch && ` for "${dSearch}"`}
        </p>
        {loading ? (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:20 }}>
            {[1,2,3,4,5,6].map(i=><SkeletonCard key={i}/>)}
          </div>
        ) : filtered.length===0 ? (
          <div style={{ textAlign:'center', padding:'80px 0', color:'#aaa' }}>
            <div style={{ fontSize:64, marginBottom:16 }}>🔍</div>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:20 }}>Ingen opslag fundet</div>
            <p style={{ marginTop:8, fontSize:15 }}>Prøv at ændre dine filtre</p>
            <Btn variant="outline" onClick={()=>{ setFilter('alle'); setSearch(''); setCity('alle'); }} radius={22} style={{ marginTop:20, padding:'11px 24px' }}>Nulstil filtre</Btn>
          </div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:20 }}>
            {filtered.map(l=>(
              <ListingCard key={l.id} listing={l} favs={favs} toggleFav={toggleFav} onClick={()=>{ setActiveListing(l); setPage('listing'); }} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ImageGallery({ images, color, emoji }) {
  const [active, setActive] = useState(0);
  if (!images || images.length === 0) {
    return <div style={{ height:380, background:color||'#FFD166', borderRadius:24, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:28, fontSize:120 }}>{emoji||'🧸'}</div>;
  }
  return (
    <div style={{ marginBottom:28 }}>
      <div style={{ position:'relative', height:380, borderRadius:24, overflow:'hidden', background:'#f0eeeb' }}>
        <img src={images[active]} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
        {images.length > 1 && <>
          <button onClick={()=>setActive(i=>(i-1+images.length)%images.length)}
            style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.92)', border:'none', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>‹</button>
          <button onClick={()=>setActive(i=>(i+1)%images.length)}
            style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.92)', border:'none', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>›</button>
          <div style={{ position:'absolute', bottom:12, left:'50%', transform:'translateX(-50%)', display:'flex', gap:6 }}>
            {images.map((_,i)=><div key={i} onClick={()=>setActive(i)} style={{ width:i===active?20:8, height:8, borderRadius:4, background:i===active?'#fff':'rgba(255,255,255,0.5)', cursor:'pointer', transition:'all 0.2s' }} />)}
          </div>
        </>}
      </div>
      {images.length > 1 && (
        <div style={{ display:'flex', gap:8, marginTop:10, overflowX:'auto', paddingBottom:4 }}>
          {images.map((src,i)=>(
            <div key={i} onClick={()=>setActive(i)} style={{ width:72, height:72, borderRadius:12, overflow:'hidden', flexShrink:0, cursor:'pointer', border:`2.5px solid ${i===active?'#06D6A0':'transparent'}`, transition:'border-color 0.15s' }}>
              <img src={src} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── LISTING DETAIL ───────────────────────────────────────────────────────────
function ListingDetailPage({ listing, setPage, showToast }) {
  const [buyModal,  setBuyModal]  = useState(false);
  const [bidModal,  setBidModal]  = useState(false);
  const [swapModal, setSwapModal] = useState(false);
  const [bidAmount, setBidAmount] = useState('');
  const [swapOffer, setSwapOffer] = useState('');
  const [msgText,   setMsgText]   = useState('');
  const [bidCount,  setBidCount]  = useState(listing.bid_count||0);
  const [saving,    setSaving]    = useState(false);

  async function handleBuy() {
    setSaving(true);
    await db.from('messages').insert({ listing_id:listing.id, sender_name:'Anonym Institution', message:`Interesseret i køb: ${listing.title}` });
    setSaving(false); setBuyModal(false);
    showToast('Køb bekræftet! Institutionen kontakter jer snart.');
  }
  async function handleBid() {
    if (!bidAmount) return;
    setSaving(true);
    const newCount = bidCount+1;
    await Promise.all([
      db.from('bids').insert({ listing_id:listing.id, bidder_name:'Anonym Institution', amount:Number(bidAmount) }),
      db.from('listings').update({ bid_count:newCount }).eq('id',listing.id)
    ]);
    setSaving(false); setBidCount(newCount); setBidModal(false);
    showToast(`Bud på ${bidAmount} kr. afsendt! 🎉`);
  }
  async function handleSwap() {
    if (!swapOffer.trim()) return;
    setSaving(true);
    await db.from('messages').insert({ listing_id:listing.id, sender_name:'Anonym Institution', message:`Bytteforslag: ${swapOffer}` });
    setSaving(false); setSwapModal(false);
    showToast('Bytteforslag sendt!');
  }
  async function handleMsg(e) {
    e.preventDefault();
    if (!msgText.trim()) return;
    setSaving(true);
    await db.from('messages').insert({ listing_id:listing.id, sender_name:'Anonym Institution', message:msgText });
    setSaving(false); setMsgText('');
    showToast('Besked sendt!');
  }

  return (
    <div style={{ minHeight:'100vh', paddingTop:80, background:'#fffcf8' }} className="page-enter">
      <div style={{ maxWidth:1140, margin:'0 auto', padding:'24px 24px 0' }}>
        <button onClick={()=>setPage('opslag')} style={{ background:'none', border:'none', fontSize:14, fontWeight:600, color:'#666', cursor:'pointer', display:'flex', alignItems:'center', gap:6, padding:'8px 0', fontFamily:"'Nunito Sans',sans-serif" }}>← Tilbage til opslag</button>
      </div>
      <div style={{ maxWidth:1140, margin:'0 auto', padding:'20px 24px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 380px', gap:40, alignItems:'start' }}>
          <div>
            <ImageGallery images={listing.images} color={listing.color} emoji={listing.emoji} />
            <div style={{ display:'flex', gap:10, marginBottom:20, flexWrap:'wrap' }}>
              <Badge type={listing.type} />
              <span style={{ fontSize:13, color:'#888' }}>📍 {listing.city}</span>
              <span style={{ fontSize:13, color:'#888' }}>👶 {listing.age_group}</span>
              <span style={{ fontSize:13, color:listing.condition==='Ny'?PRIMARY:'#888', fontWeight:600 }}>Stand: {listing.condition}</span>
            </div>
            <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:30, letterSpacing:'-0.5px', marginBottom:8 }}>{listing.title}</h1>
            <p style={{ color:'#888', fontSize:14, marginBottom:20 }}>Opslået af <strong style={{ color:'#333' }}>{listing.institution_name}</strong></p>
            <p style={{ color:'#555', lineHeight:1.75, fontSize:15, marginBottom:32 }}>{listing.description}</p>
            <div style={{ background:'#fff', borderRadius:20, padding:24, boxShadow:'0 2px 12px rgba(0,0,0,0.06)' }}>
              <h3 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:18, marginBottom:16 }}>Send besked til institutionen</h3>
              <form onSubmit={handleMsg}>
                <textarea value={msgText} onChange={e=>setMsgText(e.target.value)} placeholder="Hej, vi er interesserede i …" rows={3} style={{ width:'100%', padding:'12px 14px', borderRadius:12, border:'1.5px solid #e5e5e5', fontSize:14, resize:'vertical', fontFamily:"'Nunito Sans',sans-serif", marginBottom:12, outline:'none' }} />
                <Btn variant="primary" color={PRIMARY} radius={22} type="submit" disabled={saving||!msgText.trim()} style={{ padding:'11px 24px' }}>
                  {saving ? <><Spinner/>Sender…</> : 'Send besked'}
                </Btn>
              </form>
            </div>
          </div>

          <div style={{ position:'sticky', top:96 }}>
            <div style={{ background:'#fff', borderRadius:22, padding:28, boxShadow:'0 4px 28px rgba(0,0,0,0.10)', marginBottom:14 }}>
              {listing.price && <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:36, color:PRIMARY, marginBottom:8 }}>{listing.price} kr.</div>}
              {bidCount > 0 && <div style={{ color:'#888', fontSize:13, marginBottom:16 }}><strong style={{ color:ACCENT2 }}>{bidCount} bud</strong> afgivet</div>}
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {listing.type==='køb' && <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>setBuyModal(true)} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>🏷️ Køb nu — {listing.price} kr.</Btn>}
                {listing.type==='byd' && <Btn variant="primary" color={ACCENT2} radius={22} onClick={()=>setBidModal(true)} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>📊 Afgiv bud</Btn>}
                {listing.type==='byt' && <Btn variant="primary" color={ACCENT} radius={22} onClick={()=>setSwapModal(true)} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>🔄 Foreslå bytte</Btn>}
                <Btn variant="outline" radius={22} style={{ justifyContent:'center', padding:'13px', fontSize:14 }}>♡ Gem opslag</Btn>

              <div style={{ borderTop:'1px solid #f0f0f0', marginTop:20, paddingTop:16, display:'flex', flexDirection:'column', gap:10 }}>
                {[['🏢','Institution',listing.institution_name],['📍','By',listing.city],['👶','Aldersgruppe',listing.age_group],['⭐','Stand',listing.condition]].map(([icon,label,val],i) => (

              <div>
                <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:13, color:PRIMARY }}>CVR-verificeret institution</div>
                <div style={{ fontSize:12, color:'#5a9a74' }}>Handler sker sikkert via platformen</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <Modal open={buyModal} onClose={()=>setBuyModal(false)} title="Bekræft køb">
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ background:'#f8f7f5', borderRadius:12, padding:16 }}>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:16 }}>{listing.title}</div>
            <div style={{ color:'#888', fontSize:13, marginTop:4 }}>{listing.institution_name} · {listing.city}</div>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:15, fontWeight:600 }}>
            <span>Pris</span>
            <span style={{ color:PRIMARY, fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:18 }}>{listing.price} kr.</span>
          </div>
          <div style={{ background:'#fffbef', border:'1.5px solid #ffe08a', borderRadius:10, padding:'12px 14px', fontSize:13, color:'#7a6000' }}>💡 Betaling og afhentning aftales direkte med institutionen.</div>
          <Btn variant="primary" color={PRIMARY} radius={22} onClick={handleBuy} disabled={saving} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>{saving?<><Spinner/>Bekræfter…</>:'Bekræft køb'}</Btn>
          <Btn variant="ghost" onClick={()=>setBuyModal(false)} style={{ justifyContent:'center' }}>Annuller</Btn>
        </div>
      </Modal>

      <Modal open={bidModal} onClose={()=>setBidModal(false)} title="Afgiv bud">
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ background:'#f8f7f5', borderRadius:12, padding:16 }}>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:16 }}>{listing.title}</div>
            <div style={{ color:'#888', fontSize:13, marginTop:4 }}>{bidCount} nuværende bud</div>
          </div>
          <div>
            <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>Dit bud (kr.)</label>
            <input type="number" value={bidAmount} onChange={e=>setBidAmount(e.target.value)} placeholder="Fx 150" style={{ width:'100%', padding:'12px 14px', borderRadius:12, border:'1.5px solid #e5e5e5', fontSize:16, fontFamily:"'Nunito',sans-serif", fontWeight:700, outline:'none' }} />
          </div>
          <Btn variant="primary" color={ACCENT2} radius={22} onClick={handleBid} disabled={saving||!bidAmount} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>{saving?<><Spinner/>Sender…</>:'Send bud'}</Btn>
          <Btn variant="ghost" onClick={()=>setBidModal(false)} style={{ justifyContent:'center' }}>Annuller</Btn>
        </div>
      </Modal>

      <Modal open={swapModal} onClose={()=>setSwapModal(false)} title="Foreslå bytte">
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ background:'#FEF0E3', borderRadius:12, padding:16 }}>
            <div style={{ fontSize:13, color:'#c05a0a', fontWeight:600, marginBottom:4 }}>De tilbyder:</div>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:16 }}>{listing.title}</div>
          </div>
          <div>
            <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>I tilbyder til gengæld:</label>
            <textarea value={swapOffer} onChange={e=>setSwapOffer(e.target.value)} placeholder="Beskriv hvad I tilbyder i bytte…" rows={4} style={{ width:'100%', padding:'12px 14px', borderRadius:12, border:'1.5px solid #e5e5e5', fontSize:14, resize:'none', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }} />
          </div>
          <Btn variant="primary" color={ACCENT} radius={22} onClick={handleSwap} disabled={saving||!swapOffer.trim()} style={{ justifyContent:'center', padding:'14px', fontSize:15 }}>{saving?<><Spinner/>Sender…</>:'Send bytteforslag'}</Btn>
          <Btn variant="ghost" onClick={()=>setSwapModal(false)} style={{ justifyContent:'center' }}>Annuller</Btn>
        </div>
      </Modal>
    </div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginPage({ setPage, setLoggedIn }) {
  const [email, setEmail] = useState('');
  const [pass,  setPass]  = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  async function handleSubmit(e) {
    e.preventDefault(); setLoading(true); setError(null);
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    setLoading(false);
    if (error) { setError('Forkert e-mail eller kodeord'); return; }
    setLoggedIn(true); setPage('dashboard');
  }
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'80px 24px', background:'linear-gradient(150deg,#fffcf8 0%,#f0f9f4 100%)' }} className="page-enter">
      <div style={{ width:'100%', maxWidth:440 }}>
        <div onClick={()=>setPage('home')} style={{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', marginBottom:36, justifyContent:'center' }}>
          <div style={{ width:40, height:40, borderRadius:12, background:PRIMARY, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>♻️</div>
          <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:22 }}><span style={{ color:PRIMARY }}>Legetøjs</span>Byt</span>
        </div>
        <div style={{ background:'#fff', borderRadius:24, padding:40, boxShadow:'0 8px 40px rgba(0,0,0,0.08)' }}>
          <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:28, marginBottom:8, textAlign:'center' }}>Velkommen tilbage</h1>
          <p style={{ color:'#888', fontSize:14, textAlign:'center', marginBottom:28 }}>Log ind med jeres institutions-konto</p>
          <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', gap:16 }}>
            {[{label:'E-mail',val:email,set:setEmail,type:'email',ph:'navn@institution.dk'},{label:'Kodeord',val:pass,set:setPass,type:'password',ph:'••••••••'}].map(f=>(
              <div key={f.label}>
                <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>{f.label}</label>
                <input type={f.type} value={f.val} onChange={e=>f.set(e.target.value)} placeholder={f.ph} style={{ width:'100%', padding:'12px 14px', borderRadius:12, border:'1.5px solid #e5e5e5', fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:'none' }} />
              </div>
            ))}
            {error && <div style={{ background:'#FEF2F2', border:'1.5px solid #fca5a5', borderRadius:10, padding:'12px 16px', fontSize:13, color:'#b91c1c' }}>❌ {error}</div>}
            <button type="submit" disabled={loading} style={{ background:loading?'#aaa':PRIMARY, color:'#fff', border:'none', borderRadius:22, padding:'14px', fontSize:15, fontWeight:700, transition:'all 0.2s', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
              {loading ? <><Spinner/>Logger ind…</> : 'Log ind →'}
            </button>
          </form>
          <div style={{ textAlign:'center', marginTop:20, fontSize:13, color:'#888' }}>Ikke tilmeldt? <a onClick={()=>setPage('signup')} style={{ color:PRIMARY, fontWeight:700, cursor:'pointer' }}>Opret institution</a></div>
        </div>
      </div>
    </div>
  );
}

// ─── SIGNUP HELPERS (udenfor komponenten så de ikke remountes ved re-render) ───
function SField({label, hint, children}) {
  return (
    <div>
      <label style={{display:'block',fontSize:13,fontWeight:700,marginBottom:5}}>
        {label}{hint&&<span style={{fontWeight:400,color:'#aaa',marginLeft:6}}>{hint}</span>}
      </label>
      {children}
    </div>
  );
}
function SInput({value, onChange, type='text', placeholder, ...rest}) {
  return (
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      style={{width:'100%',padding:'11px 14px',borderRadius:12,border:'1.5px solid #e5e5e5',fontSize:14,fontFamily:"'Nunito Sans',sans-serif",outline:'none'}} {...rest} />
  );
}
function SChoiceGroup({value, onChange, options, primary}) {
  return (
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      {options.map(o=>(
        <button key={o} type="button" onClick={()=>onChange(o)}
          style={{padding:'9px 16px',borderRadius:20,border:`2px solid ${value===o?primary:'#e5e5e5'}`,background:value===o?primary:'#fff',color:value===o?'#fff':'#444',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>
          {o}
        </button>
      ))}
    </div>
  );
}

// ─── SIGNUP ───────────────────────────────────────────────────────────────────
function SignupPage({ setPage, setLoggedIn, showToast }) {
  const [step, setStep]           = useState(1);
  const [cvr, setCvr]             = useState('');
  const [cvrStatus, setCvrStatus] = useState(null);
  const [cvrData, setCvrData]     = useState(null);
  const [saving, setSaving]       = useState(false);
  const [authError, setAuthError] = useState(null);
  const [needsConfirm, setNeedsConfirm] = useState(false);
  const [form, setForm] = useState({
    inst_type:'', ownership:'', address:'', zipcode:'', city:'',
    children_count:'', inst_phone:'', website:'',
    leader_name:'', leader_phone:'', leader_email:'',
    contact_name:'', email:'', pass:''
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  async function checkCvr() {
    if (cvr.length!==8) return;
    setCvrStatus('checking');
    try {
      const res = await fetch(`https://cvrapi.dk/api?search=${cvr}&country=dk`);
      const data = await res.json();
      if (!data || data.error) throw new Error('ikke fundet');
      setCvrStatus('ok');
      const cd = { name:data.name, address:data.address||'', zipcode:data.zipcode||'', city:data.city||'', type:data.company_type||'Institution' };
      setCvrData(cd);
      setForm(f=>({...f, address:cd.address, zipcode:cd.zipcode, city:cd.city}));
    } catch { setCvrStatus('err'); }
  }

  function validateStep2() {
    if (!form.inst_type) return 'Vælg institutionstype';
    if (!form.ownership) return 'Vælg driftsform';
    if (!form.address.trim()) return 'Udfyld adresse';
    if (!form.city.trim()) return 'Udfyld by';
    return null;
  }
  function validateStep3() {
    if (!form.leader_name.trim()) return 'Udfyld institutionslederens navn';
    if (!form.leader_phone.trim()) return 'Udfyld telefonnummer';
    if (!form.leader_email.trim() || !form.leader_email.includes('@')) return 'Udfyld gyldig e-mail';
    return null;
  }
  function validateStep4() {
    if (!form.contact_name.trim()) return 'Udfyld dit navn';
    if (!form.email.trim() || !form.email.includes('@')) return 'Udfyld gyldig e-mail';
    if (form.pass.length < 6) return 'Kodeord skal være mindst 6 tegn';
    return null;
  }

  async function handleCreate() {
    const err = validateStep4();
    if (err) { setAuthError(err); return; }
    setSaving(true); setAuthError(null);
    const { data, error } = await db.auth.signUp({
      email: form.email, password: form.pass,
      options: { data: { full_name: form.contact_name } }
    });
    if (error) { setAuthError(error.message); setSaving(false); return; }
    await db.from('institutions').insert({
      cvr, name: cvrData.name,
      institution_type: form.inst_type,
      ownership_type: form.ownership,
      address: form.address, zipcode: form.zipcode, city: form.city,
      children_count: Number(form.children_count)||null,
      phone: form.inst_phone||null, website: form.website||null,
      leader_name: form.leader_name, leader_phone: form.leader_phone, leader_email: form.leader_email,
      contact_name: form.contact_name, email: form.email
    });
    setSaving(false);
    if (data.user && !data.session) { setNeedsConfirm(true); setStep(5); }
    else { setLoggedIn(true); setPage('dashboard'); showToast('Velkommen til LegetøjsByt! 🎉'); }
  }

  const steps = ['CVR','Om institutionen','Leder & kontakt','Opret konto'];
  const stepTitles = ['Verificér institution','Om institutionen','Institutionsleder','Opret konto'];
  const stepSubs   = ['Vi slår institutionen op via CVR-registret','Fortæl os lidt mere om jer','Hvem er den daglige leder?','Vælg login til platformen'];

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'80px 24px 40px',background:'linear-gradient(150deg,#fffcf8 0%,#f0f9f4 100%)'}} className="page-enter">
      <div style={{width:'100%',maxWidth:560}}>
        <div onClick={()=>setPage('home')} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',marginBottom:28,justifyContent:'center'}}>
          <div style={{width:40,height:40,borderRadius:12,background:PRIMARY,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>♻️</div>
          <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:22}}><span style={{color:PRIMARY}}>Legetøjs</span>Byt</span>
        </div>

        {step<=4 && (
          <div style={{display:'flex',alignItems:'center',marginBottom:28,gap:0}}>
            {steps.map((s,i)=>{
              const done = step>i+1, active = step===i+1;
              return (
                <React.Fragment key={i}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1,minWidth:0}}>
                    <div style={{width:32,height:32,borderRadius:'50%',background:done?PRIMARY:active?PRIMARY:'#e5e5e5',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,color:done||active?'#fff':'#aaa',transition:'all 0.2s',boxShadow:active?`0 0 0 4px ${PRIMARY}33`:'none'}}>
                      {done?'✓':i+1}
                    </div>
                    <div style={{fontSize:11,fontWeight:600,color:active?PRIMARY:done?PRIMARY:'#bbb',marginTop:4,textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:80}}>{s}</div>
                  </div>
                  {i<steps.length-1 && <div style={{flex:2,height:2,background:step>i+1?PRIMARY:'#e5e5e5',transition:'all 0.3s',marginBottom:20}}/>}
                </React.Fragment>
              );
            })}
          </div>
        )}

        <div style={{background:'#fff',borderRadius:24,padding:40,boxShadow:'0 8px 40px rgba(0,0,0,0.08)'}}>
          {step<=4 && (
            <div style={{marginBottom:28}}>
              <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:24,marginBottom:4}}>{stepTitles[step-1]}</h2>
              <p style={{color:'#888',fontSize:14}}>{stepSubs[step-1]}</p>
            </div>
          )}

          {/* ── Step 1: CVR ── */}
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <SField label="CVR-nummer (8 cifre)">
                <div style={{display:'flex',gap:10}}>
                  <input value={cvr} onChange={e=>setCvr(e.target.value.replace(/\D/g,'').slice(0,8))} placeholder="12345678" maxLength={8}
                    onKeyDown={e=>e.key==='Enter'&&checkCvr()}
                    style={{flex:1,padding:'11px 14px',borderRadius:12,border:`1.5px solid ${cvrStatus==='err'?'#ef4444':cvrStatus==='ok'?PRIMARY:'#e5e5e5'}`,fontSize:17,letterSpacing:3,fontWeight:700,outline:'none'}} />
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={checkCvr} disabled={cvr.length!==8||cvrStatus==='checking'}>
                    {cvrStatus==='checking'?<><Spinner/>Tjekker…</>:'Slå op'}
                  </Btn>
                </div>
              </SField>
              {cvrStatus==='err' && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ CVR-nummeret ikke fundet i registret. Kontrollér nummeret.</div>}
              {cvrStatus==='ok' && cvrData && (
                <div>
                  <div style={{background:'#E8F5EE',border:'1.5px solid #a7d7b8',borderRadius:14,padding:18,marginBottom:20}}>
                    <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                      <div style={{fontSize:28,lineHeight:1}}>✅</div>
                      <div>
                        <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,color:'#1a5c38',marginBottom:6}}>Fundet i CVR-registret</div>
                        <div style={{fontWeight:700,fontSize:15}}>{cvrData.name}</div>
                        <div style={{fontSize:13,color:'#555',marginTop:3}}>{cvrData.address}, {cvrData.zipcode} {cvrData.city}</div>
                      </div>
                    </div>
                  </div>
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>setStep(2)} style={{justifyContent:'center',width:'100%',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
                </div>
              )}
            </div>
          )}

          {/* ── Step 2: Om institutionen ── */}
          {step===2 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <SField label="Institutionstype">
                <SChoiceGroup value={form.inst_type} onChange={v=>set('inst_type',v)} primary={PRIMARY} options={['Vuggestue','Børnehave','Integreret institution','SFO / KSFO','Andet']} />
              </SField>
              <SField label="Driftsform">
                <SChoiceGroup value={form.ownership} onChange={v=>set('ownership',v)} primary={PRIMARY} options={['Offentlig','Privat','Selvejende']} />
              </SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 120px',gap:12}}>
                <SField label="Adresse"><SInput value={form.address} onChange={e=>set('address',e.target.value)} placeholder="Vejnavn og husnummer" /></SField>
                <SField label="Postnr."><SInput value={form.zipcode} onChange={e=>set('zipcode',e.target.value)} placeholder="1234" /></SField>
              </div>
              <SField label="By"><SInput value={form.city} onChange={e=>set('city',e.target.value)} placeholder="Fx København" /></SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <SField label="Institutionens telefon"><SInput value={form.inst_phone} onChange={e=>set('inst_phone',e.target.value)} placeholder="+45 12 34 56 78" /></SField>
                <SField label="Antal indskrevne børn"><SInput value={form.children_count} onChange={e=>set('children_count',e.target.value)} type="number" placeholder="Fx 60" /></SField>
              </div>
              <SField label="Hjemmeside" hint="(valgfri)"><SInput value={form.website} onChange={e=>set('website',e.target.value)} placeholder="https://min-institution.dk" /></SField>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(1)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ const e=validateStep2(); if(e){setAuthError(e);}else{setAuthError(null);setStep(3);} }} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
              </div>
            </div>
          )}

          {/* ── Step 3: Institutionsleder ── */}
          {step===3 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <div style={{background:'#f8f5f0',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#666'}}>
                ℹ️ Disse oplysninger vises ikke offentligt, men bruges ved henvendelse om opslag.
              </div>
              <SField label="Institutionslederens fulde navn"><SInput value={form.leader_name} onChange={e=>set('leader_name',e.target.value)} placeholder="Fornavn Efternavn" /></SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <SField label="Telefon"><SInput value={form.leader_phone} onChange={e=>set('leader_phone',e.target.value)} placeholder="+45 12 34 56 78" /></SField>
                <SField label="E-mail"><SInput value={form.leader_email} onChange={e=>set('leader_email',e.target.value)} type="email" placeholder="leder@institution.dk" /></SField>
              </div>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(2)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ const e=validateStep3(); if(e){setAuthError(e);}else{setAuthError(null);setStep(4);} }} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
              </div>
            </div>
          )}

          {/* ── Step 4: Login-konto ── */}
          {step===4 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <div style={{background:'#f8f5f0',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#666'}}>
                ℹ️ Det er disse oplysninger I logger ind med. Det kan være den samme person som lederen, eller en administrator.
              </div>
              <SField label="Dit fulde navn"><SInput value={form.contact_name} onChange={e=>set('contact_name',e.target.value)} placeholder="Fornavn Efternavn" /></SField>
              <SField label="E-mail (bruges til login)"><SInput value={form.email} onChange={e=>set('email',e.target.value)} type="email" placeholder="din@email.dk" /></SField>
              <SField label="Kodeord" hint="(mindst 6 tegn)"><SInput value={form.pass} onChange={e=>set('pass',e.target.value)} type="password" placeholder="••••••••" /></SField>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(3)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={handleCreate} disabled={saving} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>
                  {saving?<><Spinner/>Opretter…</>:'Opret institution →'}
                </Btn>
              </div>
            </div>
          )}

          {/* ── Step 5: Bekræftelse ── */}
          {step===5 && (
            <div style={{textAlign:'center'}}>
              {needsConfirm ? <>
                <div style={{fontSize:72,marginBottom:16}}>📧</div>
                <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:26,marginBottom:10}}>Bekræft din e-mail</h2>
                <p style={{color:'#555',fontSize:15,lineHeight:1.65,marginBottom:8}}>Vi har sendt en bekræftelsesmail til</p>
                <p style={{fontWeight:700,fontSize:15,color:PRIMARY,marginBottom:24}}>{form.email}</p>
                <p style={{color:'#888',fontSize:13,lineHeight:1.65,marginBottom:32}}>Klik på linket i mailen for at aktivere kontoen. Tjek evt. spam-mappen.</p>
                <Btn variant="outline" radius={22} onClick={()=>setPage('login')} style={{justifyContent:'center',padding:'13px',fontSize:14}}>Gå til login →</Btn>
              </> : <>
                <div style={{fontSize:72,marginBottom:16}}>🎉</div>
                <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:28,marginBottom:10}}>Velkommen til LegetøjsByt!</h2>
                <p style={{color:'#888',fontSize:15,lineHeight:1.65,marginBottom:32}}>{cvrData?.name} er nu oprettet og verificeret.</p>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ setLoggedIn(true); setPage('dashboard'); showToast('Velkommen! 🎉'); }} style={{justifyContent:'center',padding:'14px',fontSize:15}}>Gå til min institution →</Btn>
                  <Btn variant="outline" radius={22} onClick={()=>setPage('opslag')} style={{justifyContent:'center',padding:'13px',fontSize:14}}>Browse opslag</Btn>
                </div>
              </>}
            </div>
          )}
        </div>
        <p style={{textAlign:'center',marginTop:20,fontSize:13,color:'#888'}}>Allerede tilmeldt? <a onClick={()=>setPage('login')} style={{color:PRIMARY,fontWeight:700,cursor:'pointer'}}>Log ind her</a></p>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function DashboardPage({ setPage, showToast, allListings, onListingCreated, institution: instProp, favs, toggleFav, setActiveListing }) {
  const [newOpen,    setNewOpen]    = useState(false);
  const [step,       setStep]       = useState(1);
  const [saving,     setSaving]     = useState(false);
  const [imgFiles,   setImgFiles]   = useState([]);
  const [imgPreviews,setImgPreviews]= useState([]);
  const [tipsOpen,   setTipsOpen]   = useState(false);
  const [myListings, setMyListings] = useState([]);
  const [institution, setInstitution] = useState(instProp || null);
  const [instLoading, setInstLoading] = useState(true);
  const [authUserId,  setAuthUserId]  = useState(null);
  const [form, setForm] = useState({ title:'', type:'køb', price:'', age_group:'3-6 år', description:'', condition:'God', city:'København', emoji:'🧸', color:'#FFD166' });
  const fileRef = React.useRef(null);

  // Single effect: load auth user + institution + listings — fully self-contained
  useEffect(() => {
    let cancelled = false;
    async function boot() {
      setInstLoading(true);
      const { data: { user } } = await db.auth.getUser();
      if (!user || cancelled) { setInstLoading(false); return; }
      setAuthUserId(user.id);

      // Load institution
      const { data: inst } = await db.from('institutions')
        .select('*').eq('email', user.email).maybeSingle();
      if (!cancelled && inst) setInstitution(inst);

      // Load MY listings: filter by user_id (new) OR institution_name (legacy)
      await fetchMyListings(user.id, inst?.name);
      if (!cancelled) setInstLoading(false);
    }
    boot();
    return () => { cancelled = true; };
  }, []);

  // Re-fetch when allListings changes (new listing created by someone else / realtime)
  useEffect(() => {
    if (authUserId) fetchMyListings(authUserId, institution?.name);
  }, [allListings]);

  async function fetchMyListings(userId, instName) {
    let q = db.from('listings').select('*').eq('is_active', true).order('created_at', { ascending: false });
    if (userId && instName) {
      q = q.or(`user_id.eq.${userId},institution_name.eq.${instName}`);
    } else if (userId) {
      q = q.eq('user_id', userId);
    } else if (instName) {
      q = q.eq('institution_name', instName);
    } else { return; }
    const { data } = await q;
    if (data) setMyListings(data);
  }

  function handleFileSelect(e) {
    const files = Array.from(e.target.files);
    const toAdd = files.slice(0, 6 - imgFiles.length);
    setImgFiles(f=>[...f,...toAdd]);
    setImgPreviews(p=>[...p,...toAdd.map(f=>URL.createObjectURL(f))]);
    e.target.value = '';
  }
  function removeImg(i) {
    URL.revokeObjectURL(imgPreviews[i]);
    setImgFiles(f=>f.filter((_,j)=>j!==i));
    setImgPreviews(p=>p.filter((_,j)=>j!==i));
  }
  function resetModal() {
    imgPreviews.forEach(URL.revokeObjectURL);
    setImgFiles([]); setImgPreviews([]); setTipsOpen(false);
    setStep(1);
    setForm({ title:'', type:'køb', price:'', age_group:'3-6 år', description:'', condition:'God', city:'København', emoji:'🧸', color:'#FFD166' });
  }

  async function handleCreate() {
    if (!form.title.trim()) return;
    setSaving(true);
    // Always get fresh auth user so user_id is guaranteed
    const { data: { user } } = await db.auth.getUser();
    let inst = institution;
    if (!inst && user) {
      const { data } = await db.from('institutions').select('*').eq('email', user.email).maybeSingle();
      if (data) { inst = data; setInstitution(data); }
    }
    const { data: listing, error } = await db.from('listings').insert({
      title: form.title, type: form.type,
      price: form.type==='køb' ? Number(form.price)||null : null,
      age_group: form.age_group, description: form.description,
      condition: form.condition, city: form.city,
      institution_name: inst?.name || 'Min institution',
      user_id: user?.id || null,
      emoji: form.emoji, color: form.color,
      images: [], bid_count: 0, is_active: true
    }).select().single();
    if (error) { showToast('Noget gik galt — prøv igen', 'error'); setSaving(false); return; }
    if (imgFiles.length > 0) {
      const urls = [];
      for (const file of imgFiles) {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = `${listing.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { data: up } = await db.storage.from('listing-images').upload(path, file, { contentType: file.type });
        if (up) { const { data:{publicUrl} } = db.storage.from('listing-images').getPublicUrl(up.path); urls.push(publicUrl); }
      }
      if (urls.length > 0) await db.from('listings').update({ images: urls }).eq('id', listing.id);
    }
    setSaving(false);
    setNewOpen(false); resetModal();
    showToast('Opslag publiceret! 🎉');
    onListingCreated();
    fetchMyListings(user?.id || authUserId, inst?.name || institution?.name);
  }

  const favListings = allListings.filter(l=>favs?.includes(l.id));

  return (
    <div style={{ minHeight:'100vh', paddingTop:80, background:'#f8f5f0' }} className="page-enter">
      <div style={{ maxWidth:1140, margin:'0 auto', padding:'36px 24px' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:36 }}>
          <div>
            <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:30, letterSpacing:'-0.5px' }}>
              {institution?.name || (instLoading ? 'Indlæser…' : 'Min institution')}
            </h1>
            <p style={{ color:'#888', fontSize:14, marginTop:4 }}>
              {institution ? `CVR: ${institution.cvr} · ${institution.city}` : instLoading ? '…' : 'Institution ikke fundet'}
            </p>
          </div>
          <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>setNewOpen(true)} style={{ fontSize:15, padding:'12px 24px' }}>+ Opret opslag</Btn>
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16, marginBottom:32 }}>
          {[{icon:'📦',n:myListings.length,label:'Aktive opslag'},{icon:'🤝',n:7,label:'Handler'},{icon:'💬',n:2,label:'Beskeder'},{icon:'⭐',n:'4.8',label:'Rating'}].map((s,i)=>(
            <div key={i} style={{ background:'#fff', borderRadius:20, padding:'20px 24px', boxShadow:'0 2px 12px rgba(0,0,0,0.06)', animation:`slideUp 0.4s ease ${i*0.08}s both` }}>
              <div style={{ fontSize:24, marginBottom:6 }}>{s.icon}</div>
              <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:28, lineHeight:1 }}>{s.n}</div>
              <div style={{ fontSize:13, color:'#888', marginTop:4 }}>{s.label}</div>
            </div>
          ))}
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>

          {/* Mine opslag */}
          <div style={{ background:'#fff', borderRadius:22, padding:28, boxShadow:'0 2px 12px rgba(0,0,0,0.06)' }}>
            <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:20, marginBottom:20 }}>Mine opslag</h2>
            {myListings.length===0 ? (
              <div style={{ textAlign:'center', padding:'32px 0', color:'#bbb' }}>
                <div style={{ fontSize:36, marginBottom:10 }}>📭</div>
                <p style={{ fontSize:14 }}>Ingen opslag endnu. Opret dit første!</p>
              </div>
            ) : myListings.map(l=>(
              <div key={l.id} onClick={()=>{ setActiveListing(l); setPage('listing'); }} style={{ display:'flex', alignItems:'center', gap:14, padding:'12px 14px', border:'1.5px solid #f0eeeb', borderRadius:14, marginBottom:10, cursor:'pointer', transition:'border-color 0.15s' }}>
                <div style={{ width:48, height:48, borderRadius:10, background:l.images?.[0]?'#e8e6e3':l.color||'#FFD166', display:'flex', alignItems:'center', justifyContent:'center', fontSize:24, flexShrink:0, overflow:'hidden' }}>
                  {l.images?.[0] ? <img src={l.images[0]} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="" /> : l.emoji||'🧸'}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{l.title}</div>
                  <div style={{ fontSize:12, color:'#999', marginTop:2 }}>{l.city} · {l.age_group}</div>
                </div>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4, flexShrink:0 }}>
                  <Badge type={l.type} />
                  <div style={{ fontSize:12, color:PRIMARY, fontWeight:700 }}>
                    {l.price ? `${l.price} kr.` : l.bid_count ? `${l.bid_count} bud` : '—'}
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Mine favoritter */}
          <div style={{ background:'#fff', borderRadius:22, padding:28, boxShadow:'0 2px 12px rgba(0,0,0,0.06)' }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:20 }}>
              <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:20 }}>Mine favoritter</h2>
              {favListings.length>0 && <div style={{ background:'#fff0f3', border:'1.5px solid #fca5a5', borderRadius:99, padding:'2px 10px', fontSize:12, fontWeight:700, color:'#e11d48' }}>{favListings.length}</div>}
            </div>
            {favListings.length===0 ? (
              <div style={{ textAlign:'center', padding:'32px 0', color:'#bbb' }}>
                <div style={{ fontSize:36, marginBottom:10 }}>🤍</div>
                <p style={{ fontSize:14 }}>Tryk ❤️ på et opslag for at gemme det her</p>
                <button onClick={()=>setPage('opslag')} style={{ marginTop:14, background:'none', border:`1.5px solid ${PRIMARY}`, color:PRIMARY, borderRadius:99, padding:'8px 18px', fontSize:13, fontWeight:700, cursor:'pointer' }}>Browse opslag</button>
              </div>
            ) : favListings.map(l=>(
              <div key={l.id} style={{ display:'flex', alignItems:'center', gap:14, padding:'12px 14px', border:'1.5px solid #f0eeeb', borderRadius:14, marginBottom:10, cursor:'pointer', transition:'border-color 0.15s' }}
                onClick={()=>{ setActiveListing(l); setPage('listing'); }}>
                <div style={{ width:48, height:48, borderRadius:10, background:l.images?.[0]?'#e8e6e3':l.color||'#FFD166', display:'flex', alignItems:'center', justifyContent:'center', fontSize:24, flexShrink:0, overflow:'hidden' }}>
                  {l.images?.[0] ? <img src={l.images[0]} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="" /> : l.emoji||'🧸'}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{l.title}</div>
                  <div style={{ fontSize:12, color:'#999', marginTop:2 }}>{l.institution_name} · {l.city}</div>
                </div>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4, flexShrink:0 }}>
                  <Badge type={l.type} />
                  <button onClick={e=>{ e.stopPropagation(); toggleFav(l.id); }} style={{ fontSize:14, background:'none', border:'none', cursor:'pointer', padding:0, lineHeight:1 }}>❤️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <Modal open={newOpen} onClose={()=>{setNewOpen(false);resetModal();}} title={`Nyt opslag — trin ${step}/2`}>
        {step===1 && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>Titel *</label>
              <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Fx: LEGO Duplo stor kasse" style={{ width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #e5e5e5', fontSize:14, outline:'none' }} />
            </div>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>Handelsform</label>
              <div style={{ display:'flex', gap:8 }}>
                {['køb','byd','byt'].map(t=>(
                  <button key={t} onClick={()=>setForm({...form,type:t})} style={{ flex:1, padding:'10px', borderRadius:10, background:form.type===t?TYPE_CFG[t].bg:'#f5f4f2', color:form.type===t?TYPE_CFG[t].color:'#888', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:13, border:form.type===t?`2px solid ${TYPE_CFG[t].color}`:'2px solid transparent' }}>{TYPE_CFG[t].icon} {TYPE_CFG[t].label}</button>
                ))}
              </div>
            </div>
            {form.type==='køb' && (
              <div>
                <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>Pris (kr.)</label>
                <input type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="Fx 250" style={{ width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #e5e5e5', fontSize:14, outline:'none' }} />
              </div>
            )}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              <div>
                <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>Aldersgruppe</label>
                <select value={form.age_group} onChange={e=>setForm({...form,age_group:e.target.value})} style={{ width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #e5e5e5', fontSize:14, outline:'none', background:'#fff' }}>
                  {AGE_GROUPS.map(a=><option key={a}>{a}</option>)}
                </select>
              </div>
              <div>
                <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>By</label>
                <select value={form.city} onChange={e=>setForm({...form,city:e.target.value})} style={{ width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #e5e5e5', fontSize:14, outline:'none', background:'#fff' }}>
                  {CITIES.filter(c=>c!=='alle').map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>Vælg emoji</label>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {EMOJIS.map(e=>(
                  <button key={e} onClick={()=>setForm({...form,emoji:e})} style={{ width:40, height:40, borderRadius:10, fontSize:20, border:form.emoji===e?`2px solid ${PRIMARY}`:'2px solid #f0eeeb', background:form.emoji===e?'#E8F5EE':'#fff' }}>{e}</button>
                ))}
              </div>
            </div>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>Baggrundsfarve</label>
              <div style={{ display:'flex', gap:8 }}>
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setForm({...form,color:c})} style={{ width:30, height:30, borderRadius:8, background:c, border:'none', outline:form.color===c?`3px solid ${PRIMARY}`:'3px solid transparent', outlineOffset:2 }} />
                ))}
              </div>
            </div>
            <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>form.title.trim()&&setStep(2)} disabled={!form.title.trim()} style={{ justifyContent:'center', padding:'13px', fontSize:14 }}>Næste →</Btn>
          </div>
        )}
        {step===2 && (
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>Beskrivelse</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Beskriv legetøjets stand, hvad der medfølger, mål osv." rows={3} style={{ width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #e5e5e5', fontSize:14, resize:'none', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }} />
            </div>
            <div>
              <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:8 }}>Stand</label>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                {CONDITIONS.map(c=>(
                  <button key={c} onClick={()=>setForm({...form,condition:c})} style={{ padding:'8px 14px', borderRadius:99, fontSize:13, fontWeight:600, border:form.condition===c?`2px solid ${PRIMARY}`:'2px solid #e5e5e5', background:form.condition===c?'#E8F5EE':'#fff', color:form.condition===c?PRIMARY:'#555' }}>{c}</button>
                ))}
              </div>
            </div>

            {/* ── Billeder ── */}
            <div>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                <label style={{ fontSize:13, fontWeight:700 }}>Billeder <span style={{ fontWeight:400, color:'#aaa' }}>(op til 6)</span></label>
                {imgFiles.length < 6 && (
                  <button type="button" onClick={()=>fileRef.current?.click()}
                    style={{ fontSize:12, fontWeight:700, color:PRIMARY, background:'#E8F5EE', border:'none', borderRadius:8, padding:'5px 12px', cursor:'pointer' }}>
                    + Tilføj billede
                  </button>
                )}
              </div>
              <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleFileSelect} style={{ display:'none' }} />

              {imgPreviews.length === 0 ? (
                <div onClick={()=>fileRef.current?.click()} style={{ border:'2px dashed #d4d0cb', borderRadius:14, padding:'28px 20px', textAlign:'center', cursor:'pointer', background:'#fafaf8' }}>
                  <div style={{ fontSize:36, marginBottom:8 }}>📷</div>
                  <div style={{ fontSize:14, fontWeight:700, color:'#555', marginBottom:4 }}>Klik for at uploade billeder</div>
                  <div style={{ fontSize:12, color:'#aaa' }}>JPG, PNG eller WEBP · Maks 6 billeder</div>
                </div>
              ) : (
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
                  {imgPreviews.map((src,i)=>(
                    <div key={i} style={{ position:'relative', aspectRatio:'1', borderRadius:10, overflow:'hidden' }}>
                      <img src={src} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
                      <button onClick={()=>removeImg(i)} style={{ position:'absolute', top:4, right:4, width:22, height:22, borderRadius:'50%', background:'rgba(0,0,0,0.6)', border:'none', color:'#fff', fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>✕</button>
                      {i===0 && <div style={{ position:'absolute', bottom:4, left:4, background:'rgba(0,0,0,0.55)', borderRadius:4, padding:'2px 6px', fontSize:10, color:'#fff', fontWeight:700 }}>Forside</div>}
                    </div>
                  ))}
                  {imgFiles.length < 6 && (
                    <div onClick={()=>fileRef.current?.click()} style={{ aspectRatio:'1', borderRadius:10, border:'2px dashed #d4d0cb', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', background:'#fafaf8' }}>
                      <span style={{ fontSize:24, color:'#ccc' }}>+</span>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* ── Foto-tips ── */}
            <div style={{ background:'#fffcf5', border:'1.5px solid #ffe8a3', borderRadius:14, overflow:'hidden' }}>
              <button type="button" onClick={()=>setTipsOpen(o=>!o)}
                style={{ width:'100%', background:'none', border:'none', padding:'12px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer' }}>
                <span style={{ fontSize:13, fontWeight:700, color:'#7a5c00' }}>📸 Tips til gode produktbilleder</span>
                <span style={{ fontSize:12, color:'#aaa', transition:'transform 0.2s', transform:tipsOpen?'rotate(180deg)':'none' }}>▼</span>
              </button>
              {tipsOpen && (
                <div style={{ padding:'0 16px 16px', display:'flex', flexDirection:'column', gap:10 }}>
                  {[
                    ['💡','Godt lys','Tag billeder ved et vindue i dagslys. Undgå direkte sollys der skaber hårde skygger.'],
                    ['🎯','Ren baggrund','Brug en hvid væg, et lyst gulv eller et stykke hvidt karton som baggrund.'],
                    ['🔄','Alle vinkler','Tag billeder forfra, bagfra og fra siden — og et nærbillede af eventuelle detaljer.'],
                    ['⚠️','Vis slitage ærligt','Fotografér ridser, brud og slidte dele. Det skaber tillid og færre misforståelser.'],
                    ['📏','Vis størrelsen','Læg en genstand som en mønt eller lineal ved siden af for at vise proportioner.'],
                    ['✨','Rent legetøj','Vask eller tør legetøjet af inden fotografering — det gør en stor forskel.'],
                  ].map(([icon,title,desc])=>(
                    <div key={title} style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                      <span style={{ fontSize:18, lineHeight:1.4, flexShrink:0 }}>{icon}</span>
                      <div>
                        <div style={{ fontSize:13, fontWeight:700, color:'#444', marginBottom:1 }}>{title}</div>
                        <div style={{ fontSize:12, color:'#777', lineHeight:1.55 }}>{desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display:'flex', gap:10 }}>
              <button onClick={()=>setStep(1)} style={{ flex:1, padding:'13px', borderRadius:12, background:'#f5f4f2', border:'none', fontWeight:700, fontFamily:"'Nunito',sans-serif" }}>← Tilbage</button>
              <Btn variant="primary" color={PRIMARY} radius={22} onClick={handleCreate} disabled={saving} style={{ flex:2, justifyContent:'center', padding:'13px', fontSize:14 }}>
                {saving ? <><Spinner/>{imgFiles.length>0?'Uploader…':'Publicerer…'}</> : '✓ Publicer opslag'}
              </Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [page,          setPage]          = useState('home');
  const [activeListing, setActiveListing] = useState(null);
  const [loggedIn,      setLoggedIn]      = useState(false);
  const [institution,   setInstitution]   = useState(null);
  const [toast,         setToast]         = useState(null);
  const [listings,      setListings]      = useState([]);
  const [loading,       setLoading]       = useState(true);
  const [favs,          toggleFav]        = useFavs();

  async function loadInstitution(email) {
    const { data } = await db.from('institutions').select('*').eq('email', email).maybeSingle();
    if (data) setInstitution(data);
  }

  async function fetchListings() {
    setLoading(true);
    const { data, error } = await db
      .from('listings')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false });
    if (!error && data) setListings(data);
    setLoading(false);
  }

  useEffect(() => {
    fetchListings();
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { setLoggedIn(true); loadInstitution(session.user.email); }
    });
    const { data: { subscription } } = db.auth.onAuthStateChange((_event, session) => {
      if (session) { setLoggedIn(true); loadInstitution(session.user.email); }
      else { setLoggedIn(false); setInstitution(null); }
    });
    return () => subscription.unsubscribe();
  }, []);

  // Real-time: refresh whenever listings table changes
  useEffect(() => {
    const channel = db.channel('rt-listings')
      .on('postgres_changes', { event:'*', schema:'public', table:'listings' }, fetchListings)
      .subscribe();
    return () => db.removeChannel(channel);
  }, []);

  function showToast(msg, type='success') { setToast({ msg, type }); }
  function navigate(p) { setPage(p); window.scrollTo({ top:0, behavior:'smooth' }); }

  return (
    <div>
      <Nav page={page} setPage={navigate} loggedIn={loggedIn} setLoggedIn={setLoggedIn} />

      {page==='home'      && <HomePage setPage={navigate} setActiveListing={setActiveListing} listings={listings} loading={loading} favs={favs} toggleFav={toggleFav} />}
      {page==='opslag'    && <OpslagPage listings={listings} loading={loading} setPage={navigate} setActiveListing={setActiveListing} favs={favs} toggleFav={toggleFav} />}
      {page==='listing'   && activeListing && <ListingDetailPage listing={activeListing} setPage={navigate} showToast={showToast} />}
      {page==='login'     && <LoginPage setPage={navigate} setLoggedIn={setLoggedIn} />}
      {page==='signup'    && <SignupPage setPage={navigate} setLoggedIn={setLoggedIn} showToast={showToast} />}
      {page==='dashboard' && <DashboardPage setPage={navigate} showToast={showToast} allListings={listings} onListingCreated={fetchListings} institution={institution} favs={favs} toggleFav={toggleFav} setActiveListing={setActiveListing} />}
      {page==='hvordan'   && <HowItWorksPage setPage={navigate} />}

      {toast && <Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
