// ─── HOOKS ───────────────────────────────────────────────────────────────────
function useWindowWidth() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return w;
}

function useDebounce(val, ms) {
  const [d, setD] = useState(val);
  useEffect(() => { const t = setTimeout(() => setD(val), ms); return () => clearTimeout(t); }, [val, ms]);
  return d;
}

function useFavs() {
  const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem('ltb_favs')||'[]'); } catch { return []; }});
  const toggle = useCallback(id => {
    setFavs(prev => {
      const next = prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id];
      localStorage.setItem('ltb_favs', JSON.stringify(next));
      return next;
    });
  }, []);
  return [favs, toggle];
}

function Btn({ children, variant='primary', onClick, style={}, color=PRIMARY, radius=14, disabled=false, type='button' }) {
  const [hov, setHov] = useState(false);

  const up = () => { setHov(false); };
  if (variant==='primary') return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:color, color:'#fff', boxShadow:hov&&!disabled?`0 6px 22px ${color}55`:'none', transform:hov&&!disabled?'translateY(-1px)':'none'}}>{children}</button>;
  if (variant==='outline') return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:hov?'#f5f5f5':'#fff', color:'#333', border:'1.5px solid #ddd'}}>{children}</button>;
  if (variant==='ghost')   return <button type={type} onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={up} style={{...base, background:'transparent', color:hov?color:'#666', padding:'8px 14px'}}>{children}</button>;
}

function Modal({ open, onClose, children, title }) {
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; return () => { document.body.style.overflow = ''; }; }, [open]);
  const w = useWindowWidth();
  const isMobile = w < 600;
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:isMobile?'flex-end':'center', justifyContent:'center', padding:isMobile?0:20, backdropFilter:'blur(6px)', animation:'fadeIn 0.2s ease' }}>

        </div>
        {children}

    </div>
  );
}

function Toast({ msg, type='success', onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3200); return () => clearTimeout(t); }, []);
  const icon = type==='success' ? '✅' : type==='error' ? '❌' : 'ℹ️';
  return (

const CONDITION_COLORS = { 'Ny':{ bg:'#e6f9f0', color:'#1a7a4a' }, 'Meget god':{ bg:'#e6f9f0', color:'#1a7a4a' }, 'God':{ bg:'#fff8e1', color:'#b45309' }, 'Acceptabel':{ bg:'#fee2e2', color:'#b91c1c' } };

function ListingCard({ listing, onClick, favs, toggleFav }) {
  const isFav = favs.includes(listing.id);
  const [popping, setPopping] = useState(false);

    e.stopPropagation();
    const adding = !isFav;
    toggleFav(listing.id);
    setPopping(true);
    setTimeout(()=>setPopping(false), 350);
    const newCount = Math.max(0, localFavCount + (adding ? 1 : -1));
    setLocalFavCount(newCount);
    db.from('listings').update({ fav_count: newCount }).eq('id', listing.id).select()
      .then(({ data, error }) => { console.log('[fav_count]', { newCount, id: listing.id, data, error }); });
  }
  function prevImg(e) { e.stopPropagation(); setImgIdx(i => (i - 1 + imgs.length) % imgs.length); }
  function nextImg(e) { e.stopPropagation(); setImgIdx(i => (i + 1) % imgs.length); }
  const condStyle = CONDITION_COLORS[listing.condition] || { bg:'#f3f4f6', color:'#555' };
  const typeColors = { køb:{ bg:'#e6f9f0', color:'#1a7a4a' }, byd:{ bg:'#fef3c7', color:'#92400e' }, byt:{ bg:'#dbeafe', color:'#1e40af' } };

  const typeLabel = { køb:'Køb', byd:'Byd', byt:'Byt' }[listing.type] || listing.type;
  return (
    <div className="card" onClick={onClick} style={{ background:'#fff', borderRadius:16, overflow:'hidden', cursor:'pointer', boxShadow:'0 2px 12px rgba(0,0,0,0.07)', position:'relative', display:'flex', flexDirection:'column' }}>

        {imgs.length
          ? <img src={imgs[imgIdx]} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />

// Haversine distance in km
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Cache geocoding results
const geoCache = {};
async function geocodeCity(city) {
  if (geoCache[city]) return geoCache[city];
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city+', Danmark')}&format=json&limit=1`, { headers:{ 'Accept-Language':'da' } });
    const d = await r.json();
    if (d[0]) { geoCache[city] = { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) }; return geoCache[city]; }
  } catch {}
  return null;
}

function OpslagPage({ listings, loading, setPage, setActiveListing, favs, toggleFav }) {
  const ww = useWindowWidth();
  const isMobile = ww < 640;
  const [filter, setFilter] = useState('alle');
  const [search, setSearch] = useState('');
  const [city, setCity]     = useState('alle');
  const [sort, setSort]     = useState('newest');
  const [maxDist, setMaxDist] = useState('alle');
  const [activeTags, setActiveTags] = useState([]);
  const [tagDropOpen, setTagDropOpen] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [geoLoading, setGeoLoading] = useState(false);
  const [listingCoords, setListingCoords] = useState({});
  const dSearch = useDebounce(search, 180);

  // Load user's location from their institution
  useEffect(() => {
    db.auth.getUser().then(async ({ data:{ user } }) => {
      if (!user) return;
      const { data: inst } = await db.from('institutions').select('city,zipcode').eq('email', user.email).maybeSingle();
      if (!inst) return;
      const q = inst.zipcode ? `${inst.zipcode} ${inst.city}, Danmark` : `${inst.city}, Danmark`;
      setGeoLoading(true);
      const coords = await geocodeCity(q);
      if (coords) setUserCoords(coords);
      setGeoLoading(false);
    });
  }, []);

  // Geocode all unique listing cities when distance filter is active
  useEffect(() => {
    if (maxDist === 'alle') return;
    const cities = [...new Set(listings.map(l => l.city).filter(Boolean))];
    cities.forEach(async c => {
      if (listingCoords[c]) return;
      const coords = await geocodeCity(c + ', Danmark');
      if (coords) setListingCoords(prev => ({ ...prev, [c]: coords }));
    });
  }, [maxDist, listings]);

  const filtered = useMemo(() => {
    let r = listings.filter(l => {
      const matchType   = filter==='alle' || l.type===filter;
      const matchCity   = city==='alle'   || l.city===city;
      const matchSearch = !dSearch || l.title.toLowerCase().includes(dSearch.toLowerCase()) || (l.institution_name||'').toLowerCase().includes(dSearch.toLowerCase()) || (l.tags||[]).some(t=>t.toLowerCase().includes(dSearch.toLowerCase()));
      const matchTag = activeTags.length === 0 || activeTags.every(t => (l.tags||[]).includes(t));
      let matchDist = true;
      if (maxDist !== 'alle' && userCoords && l.city) {
        const coords = listingCoords[l.city];
        if (coords) matchDist = haversine(userCoords.lat, userCoords.lon, coords.lat, coords.lon) <= Number(maxDist);
        else matchDist = true; // include until geocoded
      }
      return matchType && matchCity && matchSearch && matchDist && matchTag;
    });
    if (sort==='newest')     r = [...r].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if (sort==='price-asc')  r = [...r].sort((a,b)=>(a.price||0)-(b.price||0));
    if (sort==='price-desc') r = [...r].sort((a,b)=>(b.price||0)-(a.price||0));
    if (sort==='bids')       r = [...r].sort((a,b)=>(b.bid_count||0)-(a.bid_count||0));
    if (maxDist !== 'alle' && userCoords) {
      r = [...r].sort((a,b) => {
        const ca = listingCoords[a.city], cb = listingCoords[b.city];
        const da = ca ? haversine(userCoords.lat, userCoords.lon, ca.lat, ca.lon) : 9999;
        const db2 = cb ? haversine(userCoords.lat, userCoords.lon, cb.lat, cb.lon) : 9999;
        return da - db2;
      });
    }
    return r;
  }, [listings, filter, city, dSearch, sort, maxDist, userCoords, listingCoords, activeTags]);

  return (
    <div style={{ minHeight:'100vh', paddingTop:68, background:'#fffcf8' }}>
      <div style={{ position:'sticky', top:68, zIndex:400, background:'rgba(255,252,248,0.97)', borderBottom:'1px solid #f0eeeb', backdropFilter:'blur(14px)', padding:isMobile?'10px 12px':'14px 24px' }}>
        <div style={{ maxWidth:1140, margin:'0 auto', display:'flex', flexDirection:'column', gap:8 }}>
          {/* Row 1: search */}
          <div style={{ display:'flex', gap:8 }}>
            <div style={{ flex:1, background:'#f5f4f2', borderRadius:12, display:'flex', alignItems:'center', padding:'10px 14px', gap:10, border:'1.5px solid #eceae6' }}>
              <span style={{ color:'#bbb', fontSize:16 }}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Søg i opslag..." style={{ border:'none', background:'transparent', outline:'none', fontSize:14, fontFamily:"'Nunito Sans',sans-serif", flex:1, minWidth:0 }} />
              {search && <button onClick={()=>setSearch('')} style={{ border:'none', background:'none', color:'#bbb', fontSize:15 }}>✕</button>}
            </div>
          </div>
          {/* Row 2: filters */}
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' }}>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              {['alle','køb','byd','byt'].map(f => (
                <button key={f} onClick={()=>setFilter(f)} style={{ padding:isMobile?'7px 14px':'9px 18px', borderRadius:99, border:filter===f?'none':'1.5px solid #ddd', background:filter===f?PRIMARY:'#fff', color:filter===f?'#fff':'#555', fontSize:13, fontWeight:700, fontFamily:"'Nunito',sans-serif", transition:'all 0.15s', textTransform:'capitalize', whiteSpace:'nowrap' }}>{f}</button>
              ))}
            </div>
            <select value={city} onChange={e=>setCity(e.target.value)} style={{ padding:'8px 12px', borderRadius:12, border:'1.5px solid #eceae6', fontSize:13, background:'#f5f4f2', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }}>
              {CITIES.map(c=><option key={c} value={c}>{c==='alle'?'Alle byer':c}</option>)}
            </select>
            <select value={sort} onChange={e=>setSort(e.target.value)} style={{ padding:'8px 12px', borderRadius:12, border:'1.5px solid #eceae6', fontSize:13, background:'#f5f4f2', fontFamily:"'Nunito Sans',sans-serif", outline:'none' }}>
              <option value="newest">Nyeste først</option>
              <option value="price-asc">Pris: lav → høj</option>
              <option value="price-desc">Pris: høj → lav</option>
              <option value="bids">Flest bud</option>
            </select>
          <div style={{ position:'relative' }}>
            <select value={maxDist} onChange={e=>setMaxDist(e.target.value)} style={{ padding:'10px 36px 10px 14px', borderRadius:12, border:`1.5px solid ${maxDist!=='alle'?PRIMARY:'#eceae6'}`, fontSize:14, background:maxDist!=='alle'?'#e8f5ee':'#f5f4f2', fontFamily:"'Nunito Sans',sans-serif", outline:'none', color:maxDist!=='alle'?PRIMARY:'#555', fontWeight:maxDist!=='alle'?700:400, appearance:'none', cursor:'pointer' }}>
              <option value="alle">📍 Afstand</option>
              <option value="5">Inden for 5 km</option>
              <option value="10">Inden for 10 km</option>
              <option value="25">Inden for 25 km</option>
              <option value="50">Inden for 50 km</option>
              <option value="100">Inden for 100 km</option>
            </select>
            {geoLoading && <span style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', fontSize:12 }}>⏳</span>}
            {!userCoords && maxDist!=='alle' && <div style={{ position:'absolute', top:'110%', left:0, background:'#fff', border:'1.5px solid #fca5a5', borderRadius:10, padding:'8px 12px', fontSize:12, color:'#b91c1c', whiteSpace:'nowrap', zIndex:10, boxShadow:'0 4px 12px rgba(0,0,0,0.1)' }}>Log ind for at bruge afstandsfilter</div>}
          </div>
          {/* Row 3: multi-select tag dropdown */}
          <div style={{ position:'relative' }}>
            <button onClick={()=>setTagDropOpen(o=>!o)}
              style={{ padding:'8px 14px', borderRadius:12, border:`1.5px solid ${activeTags.length?'#2563eb':'#eceae6'}`, background:activeTags.length?'#eff6ff':'#f5f4f2', fontSize:13, fontWeight:activeTags.length?700:400, color:activeTags.length?'#2563eb':'#555', cursor:'pointer', display:'flex', alignItems:'center', gap:6, whiteSpace:'nowrap' }}>
              🏷️ Kategorier
              {activeTags.length > 0 && <span style={{ background:'#2563eb', color:'#fff', borderRadius:99, padding:'1px 7px', fontSize:11, fontWeight:700 }}>{activeTags.length}</span>}
              <span style={{ fontSize:10, color:'#aaa' }}>{tagDropOpen ? '▲' : '▼'}</span>
            </button>
            {tagDropOpen && (
              <div style={{ position:'absolute', top:'calc(100% + 6px)', left:0, zIndex:500, background:'#fff', border:'1.5px solid #e5e5e5', borderRadius:14, boxShadow:'0 8px 28px rgba(0,0,0,0.12)', padding:12, minWidth:280 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                  <span style={{ fontSize:12, fontWeight:700, color:'#555' }}>Vælg kategorier</span>
                  {activeTags.length > 0 && <button onClick={()=>setActiveTags([])} style={{ fontSize:11, fontWeight:700, color:'#2563eb', background:'none', border:'none', cursor:'pointer' }}>Ryd alle</button>}
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  {LISTING_TAGS.map(t => {
                    const sel = activeTags.includes(t);
                    return (
                      <button key={t} onClick={()=>setActiveTags(prev => sel ? prev.filter(x=>x!==t) : [...prev, t])}
                        style={{ padding:'5px 12px', borderRadius:99, fontSize:12, fontWeight:700, border:sel?'2px solid #2563eb':'1.5px solid #ddd', background:sel?'#eff6ff':'#f9f9f9', color:sel?'#2563eb':'#666', cursor:'pointer', transition:'all 0.12s' }}>
                        {sel ? '✓ ' : ''}{t}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      <div style={{ maxWidth:1140, margin:'0 auto', padding:isMobile?'16px 12px':'28px 24px' }}>
        <p style={{ color:'#999', fontSize:14, marginBottom:22 }}>
          {loading ? 'Henter opslag…' : `${filtered.length} opslag fundet`}{dSearch && ` for "${dSearch}"`}
        </p>
        {loading ? (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:20 }}>
            {[1,2,3,4,5,6].map(i=><SkeletonCard key={i}/>)}
          </div>
        ) : filtered.length===0 ? (
          <div style={{ textAlign:'center', padding:'80px 0', color:'#aaa' }}>
            <div style={{ fontSize:64, marginBottom:16 }}>🔍</div>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:20 }}>Ingen opslag fundet</div>
            <p style={{ marginTop:8, fontSize:15 }}>Prøv at ændre dine filtre</p>
            <Btn variant="outline" onClick={()=>{ setFilter('alle'); setSearch(''); setCity('alle'); setActiveTags([]); }} radius={22} style={{ marginTop:20, padding:'11px 24px' }}>Nulstil filtre</Btn>
          </div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:20 }}>
            {filtered.map(l=>(
              <ListingCard key={l.id} listing={l} favs={favs} toggleFav={toggleFav} onClick={()=>{ setActiveListing(l); setPage('listing'); }} />
            ))}
          </div>
        )}
      </div>
    </div>
  </div>
  );
}

// ─── IMAGE GALLERY ────────────────────────────────────────────────────────────
function ImageGallery({ images, color, emoji }) {
  const [active, setActive] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  const w = useWindowWidth();
  const imgH = w < 500 ? 260 : w < 768 ? 320 : 380;
  if (!images || images.length === 0) {
    return <div style={{ height:imgH, background:color||'#FFD166', borderRadius:20, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:20, fontSize:100 }}>{emoji||'🧸'}</div>;
  }
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ position:'relative', height:imgH, borderRadius:20, overflow:'hidden', background:'#f0eeeb' }}>
        <img src={images[active]} alt="" onClick={()=>setLightbox(true)} style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', cursor:'zoom-in' }} />
        <div style={{ position:'absolute', bottom:12, right:12, background:'rgba(0,0,0,0.48)', color:'#fff', borderRadius:8, padding:'4px 10px', fontSize:11, fontWeight:600, pointerEvents:'none' }}>🔍 Klik for fuld visning</div>
        {images.length > 1 && <>
          <button onClick={()=>setActive(i=>(i-1+images.length)%images.length)}
            style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.92)', border:'none', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>‹</button>
          <button onClick={()=>setActive(i=>(i+1)%images.length)}
            style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.92)', border:'none', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>›</button>
          <div style={{ position:'absolute', bottom:12, left:'50%', transform:'translateX(-50%)', display:'flex', gap:6 }}>
            {images.map((_,i)=><div key={i} onClick={()=>setActive(i)} style={{ width:i===active?20:8, height:8, borderRadius:4, background:i===active?'#fff':'rgba(255,255,255,0.5)', cursor:'pointer', transition:'all 0.2s' }} />)}
          </div>
        </>}
      </div>
      {images.length > 1 && (
        <div style={{ display:'flex', gap:8, marginTop:10, overflowX:'auto', paddingBottom:4 }}>
          {images.map((src,i)=>(
            <div key={i} onClick={()=>setActive(i)} style={{ width:72, height:72, borderRadius:12, overflow:'hidden', flexShrink:0, cursor:'pointer', border:`2.5px solid ${i===active?'#06D6A0':'transparent'}`, transition:'border-color 0.15s' }}>
              <img src={src} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
            </div>
          ))}
        </div>
      )}
      {/* Lightbox */}
      {lightbox && (
        <div onClick={()=>setLightbox(false)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.93)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', cursor:'zoom-out' }}>
          <img src={images[active]} alt="" onClick={e=>e.stopPropagation()} style={{ maxWidth:'92vw', maxHeight:'88vh', objectFit:'contain', borderRadius:10, boxShadow:'0 8px 48px rgba(0,0,0,0.5)' }} />
          {images.length > 1 && <>
            <button onClick={e=>{e.stopPropagation();setActive(i=>(i-1+images.length)%images.length);}} style={{ position:'absolute', left:20, top:'50%', transform:'translateY(-50%)', background:'rgba(255,255,255,0.15)', border:'none', color:'#fff', borderRadius:'50%', width:52, height:52, fontSize:28, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>
            <button onClick={e=>{e.stopPropagation();setActive(i=>(i+1)%images.length);}} style={{ position:'absolute', right:20, top:'50%', transform:'translateY(-50%)', background:'rgba(255,255,255,0.15)', border:'none', color:'#fff', borderRadius:'50%', width:52, height:52, fontSize:28, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>
          </>}
          <button onClick={()=>setLightbox(false)} style={{ position:'absolute', top:20, right:20, background:'rgba(255,255,255,0.15)', border:'none', color:'#fff', borderRadius:'50%', width:44, height:44, fontSize:20, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
          <div style={{ position:'absolute', bottom:20, color:'rgba(255,255,255,0.6)', fontSize:13 }}>{active+1} / {images.length}</div>
        </div>
      )}
    </div>
  );
}

// ─── LISTING DETAIL ───────────────────────────────────────────────────────────
function ListingDetailPage({ listing, setPage, showToast, onStartConv, favs, toggleFav, setSelectedConvId, loggedIn }) {
  const [buyModal,  setBuyModal]  = useState(false);
  const [bidModal,  setBidModal]  = useState(false);
  const [swapModal, setSwapModal] = useState(false);
  const [bidAmount, setBidAmount] = useState('');
  const [swapOffer, setSwapOffer] = useState('');
  const [selectedSwapId, setSelectedSwapId] = useState(null);
  const [bidCount,  setBidCount]  = useState(listing.bid_count||0);
  const [saving,    setSaving]    = useState(false);
  const [currentUserId, setCurrentUserId] = useState(null);
  const [currentUserEmail, setCurrentUserEmail] = useState(null);
  const [ownListings, setOwnListings] = useState([]);
  const [isFav, setIsFav] = useState(favs?.includes(listing.id) || false);
  const [localFavCount, setLocalFavCount] = useState(listing.fav_count || 0);
  const [shareModal, setShareModal] = useState(false);
  const [teamMembers, setTeamMembers] = useState([]);
  const [selectedEmails, setSelectedEmails] = useState([]);
  const [shareNote, setShareNote] = useState('');
  const [shareSending, setShareSending] = useState(false);
  const [myInstName, setMyInstName] = useState(null);

  useEffect(() => {
    db.auth.getUser().then(async ({ data:{ user } }) => {
      if (!user) return;
      setCurrentUserId(user.id);
      setCurrentUserEmail(user.email);
      db.from('listings').select('id,title,emoji,color,images').eq('user_id', user.id).eq('is_active', true).neq('id', listing.id)
        .then(({ data }) => { if (data) setOwnListings(data); });
      // Load institution members for sharing
      const { data: inst } = await db.from('institutions').select('id,name,email').eq('email', user.email).maybeSingle();
      if (inst) {
        setMyInstName(inst.name);
        const { data: mems } = await db.from('institution_members').select('*').eq('institution_id', inst.id);
        if (mems?.length) setTeamMembers(mems);
      } else {
        const { data: mem } = await db.from('institution_members').select('role,institutions(id,name,email)').eq('email', user.email).maybeSingle();
        if (mem?.institutions) {
          setMyInstName(mem.institutions.name);
          const { data: mems } = await db.from('institution_members').select('*').eq('institution_id', mem.institutions.id);
          // Also include admin as recipient
          const adminEntry = { id: 'admin', email: mem.institutions.email, role: 'admin' };
          setTeamMembers([adminEntry, ...(mems||[])]);
        }
      }
    });
  }, []);

  // Sync fav state when favs prop changes
  useEffect(() => { setIsFav(favs?.includes(listing.id) || false); }, [favs, listing.id]);

  function handleToggleFav() {
    const adding = !isFav;
    toggleFav?.(listing.id);
    setIsFav(v => !v);
    const newCount = Math.max(0, localFavCount + (adding ? 1 : -1));
    setLocalFavCount(newCount);
    db.from('listings').update({ fav_count: newCount }).eq('id', listing.id);
  }

  async function handleShare() {
    if (!selectedEmails.length || !currentUserId) return;
    setShareSending(true);
    await Promise.all(selectedEmails.map(email =>
      db.from('listing_shares').insert({
        listing_id: listing.id,
        listing_title: listing.title,
        listing_image: listing.images?.[0] || null,
        listing_type: listing.type,
        listing_price: listing.price || null,
        listing_emoji: listing.emoji,
        listing_color: listing.color,
        listing_institution_name: listing.institution_name,
        listing_city: listing.city,
        from_user_id: currentUserId,
        from_name: myInstName || 'Ukendt',
        to_email: email,
        note: shareNote.trim() || null,
      })
    ));
    setShareSending(false);
    setShareModal(false); setSelectedEmails([]); setShareNote('');
    showToast(`Opslag delt med ${selectedEmails.length} medarbejder${selectedEmails.length > 1 ? 'e' : ''}! 📤`);
  }

  const isOwn = currentUserId && listing.user_id && currentUserId === listing.user_id;

  async function handleBuy() {
    setSaving(true);
    await db.from('messages').insert({ listing_id:listing.id, sender_name:'Anonym Institution', message:`Interesseret i køb: ${listing.title}` });
    setSaving(false); setBuyModal(false);
    showToast('Køb bekræftet! Institutionen kontakter jer snart.');
  }
  async function handleBid() {
    if (!bidAmount) return;
    if (!currentUserId) { showToast('Log ind for at byde', 'error'); return; }
    setSaving(true);
    const newCount = bidCount + 1;
    await Promise.all([
      db.from('bids').insert({ listing_id: listing.id, bidder_name: 'Anonym Institution', amount: Number(bidAmount) }),
      db.from('listings').update({ bid_count: newCount }).eq('id', listing.id)
    ]);
    // Create or find conversation, then insert bid message
    try {
      const { data: { user } } = await db.auth.getUser();
      const { data: inst } = await db.from('institutions').select('name').eq('email', user.email).maybeSingle();
      const userName = inst?.name || user.email;
      let convId = null;
      let ownerUnread = 0;
      const { data: existing } = await db.from('conversations')
        .select('id,owner_unread').eq('listing_id', listing.id).eq('initiator_id', currentUserId).maybeSingle();
      if (existing) {
        convId = existing.id;
        ownerUnread = existing.owner_unread || 0;
      } else {
        const { data: conv } = await db.from('conversations').insert({
          listing_id: listing.id, listing_title: listing.title,
          listing_emoji: listing.emoji, listing_color: listing.color,
          listing_image: listing.images?.[0] || null,
          initiator_id: currentUserId, initiator_name: userName,
          owner_id: listing.user_id, owner_name: listing.institution_name,
        }).select().single();
        convId = conv?.id;
      }
      if (convId) {
        const bidMsg = `Bud: ${bidAmount} kr.`;
        await db.from('chat_messages').insert({
          conversation_id: convId, sender_id: currentUserId, sender_name: userName,
          content: bidMsg, message_type: 'bid',
          bid_amount: Number(bidAmount), bid_status: 'pending',
        });
        await db.from('conversations').update({
          last_message: bidMsg, last_message_at: new Date().toISOString(),
          owner_unread: ownerUnread + 1,
        }).eq('id', convId);
        setSaving(false); setBidCount(newCount); setBidModal(false);
        showToast(`Bud på ${bidAmount} kr. afsendt! 🎉`);
        if (setSelectedConvId) setSelectedConvId(convId);
        setPage('beskeder');
        return;
      }
    } catch {}
    setSaving(false); setBidCount(newCount); setBidModal(false);
    showToast(`Bud på ${bidAmount} kr. afsendt! 🎉`);
  }
  async function handleSwap() {
    const chosen = ownListings.find(l => l.id === selectedSwapId);
    if (!chosen && !swapOffer.trim()) return;
    setSaving(true);
    const offerText = chosen ? `Bytteforslag: ${chosen.title}` : `Bytteforslag: ${swapOffer}`;
    await db.from('messages').insert({ listing_id:listing.id, sender_name:'Anonym Institution', message:offerText });
    setSaving(false); setSwapModal(false); setSelectedSwapId(null); setSwapOffer('');
    showToast('Bytteforslag sendt!');
  }
  const ww = useWindowWidth();
  const isMobile = ww < 768;

  return (
    <div style={{ minHeight:'100vh', paddingTop:80, background:'#fffcf8' }} className="page-enter">
      <div style={{ maxWidth:1140, margin:'0 auto', padding:'24px 16px 0' }}>
        <button onClick={()=>setPage('opslag')} style={{ background:'none', border:'none', fontSize:14, fontWeight:600, color:'#666', cursor:'pointer', display:'flex', alignItems:'center', gap:6, padding:'8px 0', fontFamily:"'Nunito Sans',sans-serif" }}>← Tilbage til markedsplads</button>
      </div>
      <div style={{ maxWidth:1140, margin:'0 auto', padding:isMobile?'16px 16px':'20px 24px' }}>
        <div style={{ display:'grid', gridTemplateColumns:isMobile?'1fr':'1fr 380px', gap:isMobile?24:40, alignItems:'start' }}>
          <div>
            <ImageGallery images={listing.images} color={listing.color} emoji={listing.emoji} />
            <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
              <Badge type={listing.type} />
              <span style={{ fontSize:13, color:'#888' }}>📍 {listing.city}</span>
              <span style={{ fontSize:13, color:'#888' }}>👶 {listing.age_group}</span>
              <span style={{ fontSize:13, color:listing.condition==='Ny'?PRIMARY:'#888', fontWeight:600 }}>Stand: {listing.condition}</span>
            </div>
            <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:isMobile?24:30, letterSpacing:'-0.5px', marginBottom:8 }}>{listing.title}</h1>
            <p style={{ color:'#888', fontSize:14, marginBottom:16 }}>Opslået af <strong style={{ color:'#333' }}>{listing.institution_name}</strong></p>
            <p style={{ color:'#555', lineHeight:1.75, fontSize:15, marginBottom:isMobile?20:32 }}>{listing.description}</p>
            {!isOwn && (
              <div style={{ background:'#fff', borderRadius:20, padding:isMobile?18:24, boxShadow:'0 2px 12px rgba(0,0,0,0.06)' }}>
                <h3 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:18, marginBottom:8 }}>Kontakt institutionen</h3>
                <p style={{ fontSize:13, color:'#888', marginBottom:16, lineHeight:1.55 }}>Send en besked direkte til {listing.institution_name} for at aftale nærmere, byde en pris eller foreslå et bytte.</p>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>onStartConv && onStartConv(listing)} style={{ padding:'12px 24px', width:'100%', justifyContent:'center', fontSize:15 }}>
                  💬 Åbn besked
                </Btn>
              </div>
            )}
            {isOwn && (
              <div style={{ background:'#f0f9f4', borderRadius:20, padding:20, border:`1.5px solid #c6e8d4`, textAlign:'center' }}>
                <div style={{ fontSize:24, marginBottom:6 }}>✏️</div>
                <div style={{ fontWeight:700, fontSize:14, color:PRIMARY, marginBottom:4 }}>Dit eget opslag</div>
                <div style={{ fontSize:13, color:'#5a9a74' }}>Rediger det fra din dashboard</div>
              </div>
            )}
          </div>

          <div style={{ position:isMobile?'static':'sticky', top:96 }}>
            <div style={{ background:'#fff', borderRadius:22, padding:28, boxShadow:'0 4px 28px rgba(0,0,0,0.10)', marginBottom:14 }}>
              {listing.price && <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:36, color:PRIMARY, marginBottom:8 }}>{listing.price} kr.</div>}
              {bidCount > 0 && <div style={{ color:'#888', fontSize:13, marginBottom:16 }}><strong style={{ color:ACCENT2 }}>{bidCount} bud</strong> afgivet</div>}
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>

                const sel = selectedEmails.includes(m.email);
                return (

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginPage({ setPage, setLoggedIn }) {
  const [email, setEmail] = useState('');
  const [pass,  setPass]  = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  async function handleSubmit(e) {
    e.preventDefault(); setLoading(true); setError(null);
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    setLoading(false);
    if (error) { setError('Forkert e-mail eller kodeord'); return; }
    setLoggedIn(true); setPage('dashboard');
  }
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'80px 24px', background:'linear-gradient(150deg,#fffcf8 0%,#f0f9f4 100%)' }} className="page-enter">
      <div style={{ width:'100%', maxWidth:440 }}>
        <div onClick={()=>setPage('home')} style={{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', marginBottom:36, justifyContent:'center' }}>
          <div style={{ width:40, height:40, borderRadius:12, background:PRIMARY, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>♻️</div>
          <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:22 }}><span style={{ color:PRIMARY }}>Legetøjs</span>Byt</span>
        </div>
        <div style={{ background:'#fff', borderRadius:24, padding:40, boxShadow:'0 8px 40px rgba(0,0,0,0.08)' }}>
          <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:28, marginBottom:8, textAlign:'center' }}>Velkommen tilbage</h1>
          <p style={{ color:'#888', fontSize:14, textAlign:'center', marginBottom:28 }}>Log ind med jeres institutions-konto</p>
          <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', gap:16 }}>
            {[{label:'E-mail',val:email,set:setEmail,type:'email',ph:'navn@institution.dk'},{label:'Kodeord',val:pass,set:setPass,type:'password',ph:'••••••••'}].map(f=>(
              <div key={f.label}>
                <label style={{ display:'block', fontSize:13, fontWeight:700, marginBottom:6 }}>{f.label}</label>
                <input type={f.type} value={f.val} onChange={e=>f.set(e.target.value)} placeholder={f.ph} style={{ width:'100%', padding:'12px 14px', borderRadius:12, border:'1.5px solid #e5e5e5', fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:'none' }} />
              </div>
            ))}
            {error && <div style={{ background:'#FEF2F2', border:'1.5px solid #fca5a5', borderRadius:10, padding:'12px 16px', fontSize:13, color:'#b91c1c' }}>❌ {error}</div>}
            <button type="submit" disabled={loading} style={{ background:loading?'#aaa':PRIMARY, color:'#fff', border:'none', borderRadius:22, padding:'14px', fontSize:15, fontWeight:700, transition:'all 0.2s', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
              {loading ? <><Spinner/>Logger ind…</> : 'Log ind →'}
            </button>
          </form>
          <div style={{ textAlign:'center', marginTop:20, fontSize:13, color:'#888' }}>Ikke tilmeldt? <a onClick={()=>setPage('signup')} style={{ color:PRIMARY, fontWeight:700, cursor:'pointer' }}>Opret institution</a></div>
        </div>
      </div>
    </div>
  );
}

// ─── SIGNUP HELPERS (udenfor komponenten så de ikke remountes ved re-render) ───
function SField({label, hint, children}) {
  return (
    <div>
      <label style={{display:'block',fontSize:13,fontWeight:700,marginBottom:5}}>
        {label}{hint&&<span style={{fontWeight:400,color:'#aaa',marginLeft:6}}>{hint}</span>}
      </label>
      {children}
    </div>
  );
}
function SInput({value, onChange, type='text', placeholder, ...rest}) {
  return (
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      style={{width:'100%',padding:'11px 14px',borderRadius:12,border:'1.5px solid #e5e5e5',fontSize:14,fontFamily:"'Nunito Sans',sans-serif",outline:'none'}} {...rest} />
  );
}
function SChoiceGroup({value, onChange, options, primary}) {
  return (
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      {options.map(o=>(
        <button key={o} type="button" onClick={()=>onChange(o)}
          style={{padding:'9px 16px',borderRadius:20,border:`2px solid ${value===o?primary:'#e5e5e5'}`,background:value===o?primary:'#fff',color:value===o?'#fff':'#444',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>
          {o}
        </button>
      ))}
    </div>
  );
}

// ─── SIGNUP ───────────────────────────────────────────────────────────────────
function SignupPage({ setPage, setLoggedIn, showToast }) {
  const [step, setStep]           = useState(1);
  const [cvr, setCvr]             = useState('');
  const [cvrStatus, setCvrStatus] = useState(null);
  const [cvrData, setCvrData]     = useState(null);
  const [saving, setSaving]       = useState(false);
  const [authError, setAuthError] = useState(null);
  const [needsConfirm, setNeedsConfirm] = useState(false);
  const [form, setForm] = useState({
    inst_type:'', ownership:'', address:'', zipcode:'', city:'',
    children_count:'', inst_phone:'', website:'',
    leader_name:'', leader_phone:'', leader_email:'',
    contact_name:'', email:'', pass:''
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  async function checkCvr() {
    if (cvr.length!==8) return;
    setCvrStatus('checking');
    try {
      const res = await fetch(`https://cvrapi.dk/api?search=${cvr}&country=dk`);
      const data = await res.json();
      if (!data || data.error) throw new Error('ikke fundet');
      setCvrStatus('ok');
      const cd = { name:data.name, address:data.address||'', zipcode:data.zipcode||'', city:data.city||'', type:data.company_type||'Institution', phone:data.phone||'', website:data.website||'' };
      setCvrData(cd);
      setForm(f=>({...f, address:cd.address, zipcode:cd.zipcode, city:cd.city, inst_phone:cd.phone, website:cd.website}));
    } catch { setCvrStatus('err'); }
  }

  function validateStep2() {
    if (!form.inst_type) return 'Vælg institutionstype';
    if (!form.ownership) return 'Vælg driftsform';
    if (!form.address.trim()) return 'Udfyld adresse';
    if (!form.city.trim()) return 'Udfyld by';
    return null;
  }
  function validateStep3() {
    if (!form.leader_name.trim()) return 'Udfyld institutionslederens navn';
    if (!form.leader_phone.trim()) return 'Udfyld telefonnummer';
    if (!form.leader_email.trim() || !form.leader_email.includes('@')) return 'Udfyld gyldig e-mail';
    return null;
  }
  function validateStep4() {
    if (!form.contact_name.trim()) return 'Udfyld dit navn';
    if (!form.email.trim() || !form.email.includes('@')) return 'Udfyld gyldig e-mail';
    if (form.pass.length < 6) return 'Kodeord skal være mindst 6 tegn';
    return null;
  }

  async function handleCreate() {
    const err = validateStep4();
    if (err) { setAuthError(err); return; }
    setSaving(true); setAuthError(null);
    const { data, error } = await db.auth.signUp({
      email: form.email, password: form.pass,
      options: { data: { full_name: form.contact_name } }
    });
    if (error) { setAuthError(error.message); setSaving(false); return; }
    await db.from('institutions').insert({
      cvr, name: cvrData.name,
      institution_type: form.inst_type,
      ownership_type: form.ownership,
      address: form.address, zipcode: form.zipcode, city: form.city,
      children_count: Number(form.children_count)||null,
      phone: form.inst_phone||null, website: form.website||null,
      leader_name: form.leader_name, leader_phone: form.leader_phone, leader_email: form.leader_email,
      contact_name: form.contact_name, email: form.email
    });
    setSaving(false);
    if (data.user && !data.session) { setNeedsConfirm(true); setStep(5); }
    else { setLoggedIn(true); setPage('dashboard'); showToast('Velkommen til LegetøjsByt! 🎉'); }
  }

  const steps = ['CVR','Om institutionen','Leder & kontakt','Opret konto'];
  const stepTitles = ['Verificér institution','Om institutionen','Institutionsleder','Opret konto'];
  const stepSubs   = ['Vi slår institutionen op via CVR-registret','Fortæl os lidt mere om jer','Hvem er den daglige leder?','Vælg login til platformen'];

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'80px 24px 40px',background:'linear-gradient(150deg,#fffcf8 0%,#f0f9f4 100%)'}} className="page-enter">
      <div style={{width:'100%',maxWidth:560}}>
        <div onClick={()=>setPage('home')} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',marginBottom:28,justifyContent:'center'}}>
          <div style={{width:40,height:40,borderRadius:12,background:PRIMARY,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>♻️</div>
          <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:22}}><span style={{color:PRIMARY}}>Legetøjs</span>Byt</span>
        </div>

        {step<=4 && (
          <div style={{display:'flex',alignItems:'center',marginBottom:28,gap:0}}>
            {steps.map((s,i)=>{
              const done = step>i+1, active = step===i+1;
              return (
                <React.Fragment key={i}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1,minWidth:0}}>
                    <div style={{width:32,height:32,borderRadius:'50%',background:done?PRIMARY:active?PRIMARY:'#e5e5e5',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,color:done||active?'#fff':'#aaa',transition:'all 0.2s',boxShadow:active?`0 0 0 4px ${PRIMARY}33`:'none'}}>
                      {done?'✓':i+1}
                    </div>
                    <div style={{fontSize:11,fontWeight:600,color:active?PRIMARY:done?PRIMARY:'#bbb',marginTop:4,textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:80}}>{s}</div>
                  </div>
                  {i<steps.length-1 && <div style={{flex:2,height:2,background:step>i+1?PRIMARY:'#e5e5e5',transition:'all 0.3s',marginBottom:20}}/>}
                </React.Fragment>
              );
            })}
          </div>
        )}

        <div style={{background:'#fff',borderRadius:24,padding:40,boxShadow:'0 8px 40px rgba(0,0,0,0.08)'}}>
          {step<=4 && (
            <div style={{marginBottom:28}}>
              <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:24,marginBottom:4}}>{stepTitles[step-1]}</h2>
              <p style={{color:'#888',fontSize:14}}>{stepSubs[step-1]}</p>
            </div>
          )}

          {/* ── Step 1: CVR ── */}
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <SField label="CVR-nummer (8 cifre)">
                <div style={{display:'flex',gap:10}}>
                  <input value={cvr} onChange={e=>setCvr(e.target.value.replace(/\D/g,'').slice(0,8))} placeholder="12345678" maxLength={8}
                    onKeyDown={e=>e.key==='Enter'&&checkCvr()}
                    style={{flex:1,padding:'11px 14px',borderRadius:12,border:`1.5px solid ${cvrStatus==='err'?'#ef4444':cvrStatus==='ok'?PRIMARY:'#e5e5e5'}`,fontSize:17,letterSpacing:3,fontWeight:700,outline:'none'}} />
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={checkCvr} disabled={cvr.length!==8||cvrStatus==='checking'}>
                    {cvrStatus==='checking'?<><Spinner/>Tjekker…</>:'Slå op'}
                  </Btn>
                </div>
              </SField>
              {cvrStatus==='err' && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ CVR-nummeret ikke fundet i registret. Kontrollér nummeret.</div>}
              {cvrStatus==='ok' && cvrData && (
                <div>
                  <div style={{background:'#E8F5EE',border:'1.5px solid #a7d7b8',borderRadius:14,padding:18,marginBottom:20}}>
                    <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                      <div style={{fontSize:28,lineHeight:1}}>✅</div>
                      <div>
                        <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,color:'#1a5c38',marginBottom:6}}>Fundet i CVR-registret</div>
                        <div style={{fontWeight:700,fontSize:15}}>{cvrData.name}</div>
                        <div style={{fontSize:13,color:'#555',marginTop:3}}>{cvrData.address}, {cvrData.zipcode} {cvrData.city}</div>
                        {cvrData.phone && <div style={{fontSize:13,color:'#555',marginTop:2}}>📞 {cvrData.phone}</div>}
                        {cvrData.website && <div style={{fontSize:13,color:'#555',marginTop:2}}>🌐 {cvrData.website}</div>}
                      </div>
                    </div>
                  </div>
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>setStep(2)} style={{justifyContent:'center',width:'100%',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
                </div>
              )}
            </div>
          )}

          {/* ── Step 2: Om institutionen ── */}
          {step===2 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <SField label="Institutionstype">
                <SChoiceGroup value={form.inst_type} onChange={v=>set('inst_type',v)} primary={PRIMARY} options={['Vuggestue','Børnehave','Integreret institution','SFO / KSFO','Andet']} />
              </SField>
              <SField label="Driftsform">
                <SChoiceGroup value={form.ownership} onChange={v=>set('ownership',v)} primary={PRIMARY} options={['Offentlig','Privat','Selvejende']} />
              </SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 120px',gap:12}}>
                <SField label="Adresse"><SInput value={form.address} onChange={e=>set('address',e.target.value)} placeholder="Vejnavn og husnummer" /></SField>
                <SField label="Postnr."><SInput value={form.zipcode} onChange={e=>set('zipcode',e.target.value)} placeholder="1234" /></SField>
              </div>
              <SField label="By"><SInput value={form.city} onChange={e=>set('city',e.target.value)} placeholder="Fx København" /></SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <SField label="Institutionens telefon"><SInput value={form.inst_phone} onChange={e=>set('inst_phone',e.target.value)} placeholder="+45 12 34 56 78" /></SField>
                <SField label="Antal indskrevne børn"><SInput value={form.children_count} onChange={e=>set('children_count',e.target.value)} type="number" placeholder="Fx 60" /></SField>
              </div>
              <SField label="Hjemmeside" hint="(valgfri)"><SInput value={form.website} onChange={e=>set('website',e.target.value)} placeholder="https://min-institution.dk" /></SField>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(1)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ const e=validateStep2(); if(e){setAuthError(e);}else{setAuthError(null);setStep(3);} }} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
              </div>
            </div>
          )}

          {/* ── Step 3: Institutionsleder ── */}
          {step===3 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <div style={{background:'#f8f5f0',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#666'}}>
                ℹ️ Disse oplysninger vises ikke offentligt, men bruges ved henvendelse om opslag.
              </div>
              <SField label="Institutionslederens fulde navn"><SInput value={form.leader_name} onChange={e=>set('leader_name',e.target.value)} placeholder="Fornavn Efternavn" /></SField>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <SField label="Telefon"><SInput value={form.leader_phone} onChange={e=>set('leader_phone',e.target.value)} placeholder="+45 12 34 56 78" /></SField>
                <SField label="E-mail"><SInput value={form.leader_email} onChange={e=>set('leader_email',e.target.value)} type="email" placeholder="leder@institution.dk" /></SField>
              </div>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(2)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ const e=validateStep3(); if(e){setAuthError(e);}else{setAuthError(null);setStep(4);} }} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>Fortsæt →</Btn>
              </div>
            </div>
          )}

          {/* ── Step 4: Login-konto ── */}
          {step===4 && (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <div style={{background:'#f8f5f0',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#666'}}>
                ℹ️ Det er disse oplysninger I logger ind med. Det kan være den samme person som lederen, eller en administrator.
              </div>
              <SField label="Dit fulde navn"><SInput value={form.contact_name} onChange={e=>set('contact_name',e.target.value)} placeholder="Fornavn Efternavn" /></SField>
              <SField label="E-mail (bruges til login)"><SInput value={form.email} onChange={e=>set('email',e.target.value)} type="email" placeholder="din@email.dk" /></SField>
              <SField label="Kodeord" hint="(mindst 6 tegn)"><SInput value={form.pass} onChange={e=>set('pass',e.target.value)} type="password" placeholder="••••••••" /></SField>
              {authError && <div style={{background:'#FEF2F2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#b91c1c'}}>❌ {authError}</div>}
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <Btn variant="outline" radius={22} onClick={()=>setStep(3)} style={{padding:'12px 20px',fontSize:14}}>← Tilbage</Btn>
                <Btn variant="primary" color={PRIMARY} radius={22} onClick={handleCreate} disabled={saving} style={{flex:1,justifyContent:'center',padding:'13px',fontSize:15}}>
                  {saving?<><Spinner/>Opretter…</>:'Opret institution →'}
                </Btn>
              </div>
            </div>
          )}

          {/* ── Step 5: Bekræftelse ── */}
          {step===5 && (
            <div style={{textAlign:'center'}}>
              {needsConfirm ? <>
                <div style={{fontSize:72,marginBottom:16}}>📧</div>
                <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:26,marginBottom:10}}>Bekræft din e-mail</h2>
                <p style={{color:'#555',fontSize:15,lineHeight:1.65,marginBottom:8}}>Vi har sendt en bekræftelsesmail til</p>
                <p style={{fontWeight:700,fontSize:15,color:PRIMARY,marginBottom:24}}>{form.email}</p>
                <p style={{color:'#888',fontSize:13,lineHeight:1.65,marginBottom:32}}>Klik på linket i mailen for at aktivere kontoen. Tjek evt. spam-mappen.</p>
                <Btn variant="outline" radius={22} onClick={()=>setPage('login')} style={{justifyContent:'center',padding:'13px',fontSize:14}}>Gå til login →</Btn>
              </> : <>
                <div style={{fontSize:72,marginBottom:16}}>🎉</div>
                <h2 style={{fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:28,marginBottom:10}}>Velkommen til LegetøjsByt!</h2>
                <p style={{color:'#888',fontSize:15,lineHeight:1.65,marginBottom:32}}>{cvrData?.name} er nu oprettet og verificeret.</p>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  <Btn variant="primary" color={PRIMARY} radius={22} onClick={()=>{ setLoggedIn(true); setPage('dashboard'); showToast('Velkommen! 🎉'); }} style={{justifyContent:'center',padding:'14px',fontSize:15}}>Gå til min institution →</Btn>
                  <Btn variant="outline" radius={22} onClick={()=>setPage('opslag')} style={{justifyContent:'center',padding:'13px',fontSize:14}}>Browse opslag</Btn>
                </div>
              </>}
            </div>
          )}
        </div>
        <p style={{textAlign:'center',marginTop:20,fontSize:13,color:'#888'}}>Allerede tilmeldt? <a onClick={()=>setPage('login')} style={{color:PRIMARY,fontWeight:700,cursor:'pointer'}}>Log ind her</a></p>
      </div>
    </div>
  );
}

// ─── SCANNING LOADER ─────────────────────────────────────────────────────────
const SCAN_MSGS = [
  { icon:'🔍', text:'Scanner billedet for personer…' },
  { icon:'🛡️', text:'Beskytter børns privatliv…' },
  { icon:'🤖', text:'AI-model analyserer pixels…' },
  { icon:'🔬', text:'Tjekker ansigter og silhuetter…' },
  { icon:'✨', text:'Næsten der…' },
];
function ScanningLoader() {
  const [idx, setIdx] = useState(0);
  const [fade, setFade] = useState(true);
  useEffect(() => {
    const iv = setInterval(() => {
      setFade(false);
      setTimeout(() => { setIdx(i => (i + 1) % SCAN_MSGS.length); setFade(true); }, 300);
    }, 1800);
    return () => clearInterval(iv);
  }, []);
  const msg = SCAN_MSGS[idx];
  return (
    <div style={{ border:'2px dashed #a8d5be', borderRadius:14, padding:'32px 20px', textAlign:'center', background:'linear-gradient(135deg,#f0faf5,#e8f5ee)' }}>
      <div style={{ fontSize:38, marginBottom:10, transition:'opacity 0.3s', opacity:fade?1:0 }}>{msg.icon}</div>
      <div style={{ fontSize:14, fontWeight:700, color:PRIMARY, marginBottom:6, transition:'opacity 0.3s', opacity:fade?1:0 }}>{msg.text}</div>
      {/* Scanning bar */}
      <div style={{ margin:'12px auto 0', width:'80%', height:4, background:'#c8e6d0', borderRadius:99, overflow:'hidden', position:'relative' }}>
        <div style={{ position:'absolute', left:0, top:0, height:'100%', width:'40%', background:PRIMARY, borderRadius:99, animation:'scanBar 1.4s ease-in-out infinite' }} />
      </div>
      <div style={{ fontSize:11, color:'#aaa', marginTop:10 }}>Dette tager typisk 2–5 sekunder</div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function DashboardPage({ setPage, showToast, allListings, onListingCreated, institution: instProp, onInstitutionChange, favs, toggleFav, setActiveListing, unreadTotal }) {
  const [newOpen,    setNewOpen]    = useState(false);
  const [step,       setStep]       = useState(1);
  const [saving,     setSaving]     = useState(false);
  const [imgFiles,   setImgFiles]   = useState([]);
  const [imgPreviews,setImgPreviews]= useState([]);
  const [tipsOpen,   setTipsOpen]   = useState(false);
  const [aiAnalyzing, setAiAnalyzing] = useState(false);
  const [myListings, setMyListings] = useState([]);
  const [institution, setInstitution] = useState(instProp || null);
  const [instLoading, setInstLoading] = useState(true);
  const [authUserId,  setAuthUserId]  = useState(null);
  const [form, setForm] = useState({ title:'', type:'køb', price:'', age_group:'3-6 år', description:'', condition:'God', emoji:'🧸', color:'#FFD166', tags:[] });
  const [editListing, setEditListing] = useState(null);
  const [editForm,    setEditForm]    = useState(null);
  const [editSaving,  setEditSaving]  = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const fileRef = React.useRef(null);
  const logoRef = React.useRef(null);
  const listingsRef = React.useRef(null);
  const [logoUploading, setLogoUploading] = useState(false);

  // Feature #5: Edit profile
  const [editProfileOpen, setEditProfileOpen] = useState(false);
  const [editProfileForm, setEditProfileForm] = useState(null);
  const [editProfileSaving, setEditProfileSaving] = useState(false);

  // Feature #2: Transaction history
  const [tradesOpen, setTradesOpen] = useState(false);
  const [trades, setTrades] = useState([]);
  const [tradesLoading, setTradesLoading] = useState(false);

  // Feature #15: Incoming requests
  const [incomingConvs, setIncomingConvs] = useState([]);

  // Feature #19: Members management
  const [membersOpen, setMembersOpen] = useState(false);
  const [members, setMembers] = useState([]);
  const [memberEmail, setMemberEmail] = useState('');
  const [memberSaving, setMemberSaving] = useState(false);

  const isAdmin = !institution?._memberRole;

  // Single effect: load auth user + institution + listings — fully self-contained
  useEffect(() => {
    let cancelled = false;
    async function boot() {
      setInstLoading(true);
      const { data: { user } } = await db.auth.getUser();
      if (!user || cancelled) { setInstLoading(false); return; }
      setAuthUserId(user.id);

      // Load institution (admin or member)
      let inst = null;
      const { data: adminInst } = await db.from('institutions').select('*').eq('email', user.email).maybeSingle();
      if (adminInst) { inst = adminInst; }
      else {
        const { data: mem } = await db.from('institution_members').select('role,institutions(*)').eq('email', user.email).maybeSingle();
        if (mem?.institutions) inst = { ...mem.institutions, _memberRole: mem.role };
      }
      if (!cancelled && inst) setInstitution(inst);

      // Load MY listings
      await fetchMyListings(user.id, inst?.name);

      // Feature #15: incoming conversations (where user is owner)
      const { data: incoming } = await db.from('conversations')
        .select('*').eq('owner_id', user.id)
        .order('last_message_at', { ascending: false });
      if (!cancelled && incoming) setIncomingConvs(incoming);

      if (!cancelled) setInstLoading(false);
    }
    boot();
    return () => { cancelled = true; };
  }, []);

  // Re-fetch when allListings changes (new listing created by someone else / realtime)
  useEffect(() => {
    if (authUserId) fetchMyListings(authUserId, institution?.name);
  }, [allListings]);

  async function fetchMyListings(userId, instName) {
    let q = db.from('listings').select('*').eq('is_active', true).order('created_at', { ascending: false });
    if (userId && instName) {
      q = q.or(`user_id.eq.${userId},institution_name.eq.${instName}`);
    } else if (userId) {
      q = q.eq('user_id', userId);
    } else if (instName) {
      q = q.eq('institution_name', instName);
    } else { return; }
    const { data } = await q;
    if (data) setMyListings(data);
  }

  function openEdit(l) {
    setEditForm({ title:l.title, type:l.type, price:l.price||'', age_group:l.age_group, description:l.description||'', condition:l.condition||'God', emoji:l.emoji||'🧸', color:l.color||'#FFD166', tags:l.tags||[] });
    setEditListing(l);
  }

  async function handleUpdate() {
    if (!editForm.title.trim()) return;
    if (editForm.type === 'køb' && !String(editForm.price).trim()) {
      showToast('Angiv en pris for køb-opslag', 'error');
      return;
    }
    setEditSaving(true);
    const { error } = await db.from('listings').update({
      title: editForm.title, type: editForm.type,
      price: editForm.type==='køb' ? Number(editForm.price)||null : null,
      age_group: editForm.age_group, description: editForm.description,
      condition: editForm.condition, city: institution?.city || editListing?.city || '',
      emoji: editForm.emoji, color: editForm.color,
      tags: editForm.tags || [],
    }).eq('id', editListing.id);
    setEditSaving(false);
    if (error) { showToast('Noget gik galt', 'error'); return; }
    setEditListing(null); setEditForm(null);
    showToast('Opslag opdateret ✓');
    fetchMyListings(authUserId, institution?.name);
    onListingCreated();
  }

  async function handleDelete(id) {
    const { error } = await db.from('listings').update({ is_active: false }).eq('id', id);
    setConfirmDelete(null);
    if (error) { showToast('Noget gik galt', 'error'); return; }
    showToast('Opslag slettet');
    fetchMyListings(authUserId, institution?.name);
    onListingCreated();
  }

  const cocoModelRef = React.useRef(null);
  const cocoLoadingRef = React.useRef(null);
  async function getCocoModel() {
    if (cocoModelRef.current) return cocoModelRef.current;
    if (!cocoLoadingRef.current) cocoLoadingRef.current = window.cocoSsd.load();
    cocoModelRef.current = await cocoLoadingRef.current;
    return cocoModelRef.current;
  }
  // Preload model in background as soon as dashboard mounts
  useEffect(() => { getCocoModel(); }, []);

  async function detectPerson(file) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = async () => {
        try {
          const model = await getCocoModel();
          const predictions = await model.detect(img);
          const hasPerson = predictions.some(p => p.class === 'person' && p.score > 0.4);
          resolve(hasPerson);
        } catch {
          resolve(false);
        } finally {
          URL.revokeObjectURL(img.src);
        }
      };
      img.src = URL.createObjectURL(file);
    });
  }

  async function handleFileSelect(e) {
    const files = Array.from(e.target.files);
    const toAdd = files.slice(0, 6 - imgFiles.length);
    e.target.value = '';
    if (!toAdd.length) return;
    setAiAnalyzing(true);
    const safeFiles = [], safePreviews = [];
    for (const file of toAdd) {
      const hasPerson = await detectPerson(file);
      if (hasPerson) {
        showToast('Billede afvist: personer må ikke være synlige på billederne', 'error');
      } else {
        safeFiles.push(file);
        safePreviews.push(URL.createObjectURL(file));
      }
    }
    setImgFiles(f => [...f, ...safeFiles]);
    setImgPreviews(p => [...p, ...safePreviews]);
    setAiAnalyzing(false);
  }
  function removeImg(i) {
    URL.revokeObjectURL(imgPreviews[i]);
    setImgFiles(f=>f.filter((_,j)=>j!==i));
    setImgPreviews(p=>p.filter((_,j)=>j!==i));
  }
  function resetModal() {
    imgPreviews.forEach(URL.revokeObjectURL);
    setImgFiles([]); setImgPreviews([]); setTipsOpen(false);
    setStep(1);
    setForm({ title:'', type:'køb', price:'', age_group:'3-6 år', description:'', condition:'God', emoji:'🧸', color:'#FFD166', tags:[] });
  }

  async function handleCreate() {
    if (!form.title.trim()) return;
    if (form.type === 'køb' && !String(form.price).trim()) {
      showToast('Angiv en pris for køb-opslag', 'error');
      return;
    }
    setSaving(true);
    // Always get fresh auth user so user_id is guaranteed
    const { data: { user } } = await db.auth.getUser();
    let inst = institution;
    if (!inst && user) {
      const { data } = await db.from('institutions').select('*').eq('email', user.email).maybeSingle();
      if (data) { inst = data; setInstitution(data); }
    }
    const { data: listing, error } = await db.from('listings').insert({
      title: form.title, type: form.type,
      price: form.type==='køb' ? Number(form.price)||null : null,
      age_group: form.age_group, description: form.description,
      condition: form.condition, city: inst?.city || institution?.city || '',
      institution_name: inst?.name || 'Min institution',
      user_id: user?.id || null,
      emoji: form.emoji, color: form.color,
      tags: form.tags || [],
      images: [], bid_count: 0, is_active: true
    }).select().single();
    if (error) { showToast('Noget gik galt — prøv igen', 'error'); setSaving(false); return; }
    if (imgFiles.length > 0) {
      const urls = [];
      for (const file of imgFiles) {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = `${listing.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { data: up } = await db.storage.from('listing-images').upload(path, file, { contentType: file.type });
        if (up) { const { data:{publicUrl} } = db.storage.from('listing-images').getPublicUrl(up.path); urls.push(publicUrl); }
      }
      if (urls.length > 0) await db.from('listings').update({ images: urls }).eq('id', listing.id);
    }
    setSaving(false);
    setNewOpen(false); resetModal();
    showToast('Opslag publiceret! 🎉');
    onListingCreated();
    fetchMyListings(user?.id || authUserId, inst?.name || institution?.name);
  }

  async function handleLogoUpload(e) {
    const file = e.target.files?.[0];
    if (!file || !authUserId || !institution) return;
    const validTypes = ['image/jpeg','image/png','image/webp','image/gif'];
    if (!validTypes.includes(file.type)) { showToast('Kun JPG, PNG eller WEBP tilladt', 'error'); return; }
    setLogoUploading(true);
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `institution-logos/${authUserId}.${ext}`;
    const { error: upErr } = await db.storage.from('listing-images').upload(path, file, { upsert: true });
    if (upErr) { showToast('Upload fejlede', 'error'); setLogoUploading(false); return; }
    const { data: { publicUrl } } = db.storage.from('listing-images').getPublicUrl(path);
    const { error: dbErr } = await db.from('institutions').update({ logo_url: publicUrl }).eq('email', institution.email);
    if (!dbErr) {
      const updated = { ...institution, logo_url: publicUrl };
      setInstitution(updated);
      onInstitutionChange?.(updated);
      showToast('Logo opdateret ✓');
    } else {
      showToast('Kunne ikke gemme logo', 'error');
    }
    setLogoUploading(false);
    e.target.value = '';
  }

  // Feature #5: Edit profile handlers
  function openEditProfile() {
    if (!institution) return;
    setEditProfileForm({
      institution_type: institution.institution_type || '',
      ownership_type: institution.ownership_type || '',
      address: institution.address || '',
      zipcode: institution.zipcode || '',
      city: institution.city || '',
      children_count: institution.children_count || '',
      phone: institution.phone || '',
      website: institution.website || '',
      leader_name: institution.leader_name || '',
      leader_phone: institution.leader_phone || '',
      leader_email: institution.leader_email || '',
      contact_name: institution.contact_name || '',
    });
    setEditProfileOpen(true);
  }
  async function handleSaveProfile() {
    if (!institution || !editProfileForm) return;
    setEditProfileSaving(true);
    const { error } = await db.from('institutions').update({
      institution_type: editProfileForm.institution_type,
      ownership_type: editProfileForm.ownership_type,
      address: editProfileForm.address,
      zipcode: editProfileForm.zipcode,
      city: editProfileForm.city,
      children_count: Number(editProfileForm.children_count) || null,
      phone: editProfileForm.phone || null,
      website: editProfileForm.website || null,
      leader_name: editProfileForm.leader_name,
      leader_phone: editProfileForm.leader_phone,
      leader_email: editProfileForm.leader_email,
      contact_name: editProfileForm.contact_name,
    }).eq('email', institution.email);
    setEditProfileSaving(false);
    if (error) { showToast('Noget gik galt', 'error'); return; }
    const updated = { ...institution, ...editProfileForm, children_count: Number(editProfileForm.children_count) || null };
    setInstitution(updated);
    onInstitutionChange?.(updated);
    setEditProfileOpen(false);
    showToast('Profil opdateret ✓');
  }

  // Feature #2: Transaction history
  async function fetchTrades() {
    if (!authUserId) return;
    setTradesLoading(true);
    const { data: convs } = await db.from('conversations')
      .select('id,listing_title,initiator_name,owner_name,initiator_id,owner_id')
      .or(`initiator_id.eq.${authUserId},owner_id.eq.${authUserId}`);
    if (!convs?.length) { setTradesLoading(false); return; }
    const { data: bidMsgs } = await db.from('chat_messages')
      .select('*').in('conversation_id', convs.map(c=>c.id))
      .eq('message_type','bid').eq('bid_status','accepted')
      .order('created_at', { ascending: false });
    if (bidMsgs) {
      setTrades(bidMsgs.map(msg => ({ ...msg, conv: convs.find(c=>c.id===msg.conversation_id) })));
    }
    setTradesLoading(false);
  }

  // Feature #19: Members handlers
  async function fetchMembers() {
    if (!institution?.id) return;
    const { data } = await db.from('institution_members').select('*').eq('institution_id', institution.id).order('created_at');
    if (data) setMembers(data);
  }
  async function addMember() {
    if (!memberEmail.trim() || !institution?.id) return;
    setMemberSaving(true);
    const { error } = await db.from('institution_members').insert({ institution_id: institution.id, email: memberEmail.trim().toLowerCase(), role: 'member' });
    setMemberSaving(false);
    if (error) {
      showToast(error.code==='23505' ? 'Brugeren er allerede tilføjet' : 'Noget gik galt', 'error');
      return;
    }
    setMemberEmail('');
    fetchMembers();
    showToast('Bruger tilføjet ✓');
  }
