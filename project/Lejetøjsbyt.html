// ─── SHARED COMPONENTS ───────────────────────────────────────────────────────
function Badge({ type }) {
  const cfg = TYPE_CFG[type] || {};
  return (
    <span style={{
      background: cfg.bg, color: cfg.color,
      fontFamily:"'Nunito', sans-serif", fontWeight:700, fontSize:12,
      padding:"3px 10px", borderRadius:99, display:"inline-block",
      whiteSpace:"nowrap"
    }}>{cfg.label}</span>
  );
}

function Btn({ children, variant="primary", onClick, style={}, color="#2A7D4F", radius=12 }) {
  const [hov, setHov] = useState(false);
  const base = {
    border:"none", borderRadius:radius, padding:"11px 24px",
    fontSize:14, fontWeight:700, fontFamily:"'Nunito',sans-serif",
    transition:"all 0.15s", display:"inline-flex", alignItems:"center", gap:8,
    ...style
  };
  if (variant === "primary") return (
    <button onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ ...base, background:color, color:"#fff", boxShadow: hov ? `0 6px 20px ${color}60` : "none", transform: hov?"translateY(-1px)":"none" }}>
      {children}
    </button>
  );
  if (variant === "outline") return (
    <button onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ ...base, background: hov ? "#f5f5f5" : "#fff", color:"#333", border:"1.5px solid #ddd" }}>
      {children}
    </button>
  );
  if (variant === "ghost") return (
    <button onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ ...base, background:"transparent", color: hov ? color : "#666", padding:"8px 12px" }}>
      {children}
    </button>
  );
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function Modal({ open, onClose, children, title }) {
  useEffect(() => {
    if (open) document.body.style.overflow = "hidden";
    else document.body.style.overflow = "";
    return () => { document.body.style.overflow = ""; };
  }, [open]);
  if (!open) return null;
  return (
    <div onClick={onClose} style={{
      position:"fixed", inset:0, background:"rgba(0,0,0,0.5)",
      zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center",
      padding:24, backdropFilter:"blur(4px)"
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:"#fff", borderRadius:20, padding:36, width:"100%",
        maxWidth:480, boxShadow:"0 24px 60px rgba(0,0,0,0.2)",
        maxHeight:"90vh", overflowY:"auto"
      }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:24 }}>
          <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:22 }}>{title}</h2>
          <button onClick={onClose} style={{
            background:"#f5f5f5", border:"none", borderRadius:99,
            width:32, height:32, fontSize:16, display:"flex",
            alignItems:"center", justifyContent:"center", cursor:"pointer"
          }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function Toast({ msg, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2800);
    return () => clearTimeout(t);
  }, []);
  return (
    <div style={{
      position:"fixed", bottom:32, left:"50%", transform:"translateX(-50%)",
      background:"#1c1a17", color:"#fff", borderRadius:99,
      padding:"12px 24px", fontWeight:700, fontSize:14,
      fontFamily:"'Nunito',sans-serif", zIndex:2000,
      boxShadow:"0 8px 32px rgba(0,0,0,0.3)",
      display:"flex", alignItems:"center", gap:10, whiteSpace:"nowrap"
    }}>
      <span style={{ fontSize:18 }}>✅</span> {msg}
    </div>
  );
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function Nav({ page, setPage, tweaks, loggedIn, setLoggedIn }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener("scroll", fn);
    return () => window.removeEventListener("scroll", fn);
  }, []);

  const navBg = (page === "home" && !scrolled)
    ? "transparent"
    : "rgba(255,252,248,0.96)";
  const hasShadow = page !== "home" || scrolled;

  return (
    <nav style={{
      position:"fixed", top:0, left:0, right:0, zIndex:500,
      background: navBg,
      backdropFilter: hasShadow ? "blur(12px)" : "none",
      boxShadow: hasShadow ? "0 1px 0 rgba(0,0,0,0.06)" : "none",
      transition:"all 0.25s", padding:"0 24px"
    }}>

        maxWidth:1140, margin:"0 auto",

            <span style={{ color:tweaks.primaryColor }}>Legetøjs</span><span style={{ color:"#1c1a17" }}>Byt</span>
          </span>
        </div>

        {/* Center links */}

          {[["opslag","Opslag"],["hvordan","Sådan virker det"]].map(([p,label]) => (
            <button key={p} onClick={()=>setPage(p)} style={{
              background:"none", border:"none", padding:"8px 14px",
              fontSize:14, fontWeight:600, color: page===p ? tweaks.primaryColor : "#555",
              borderRadius:8, cursor:"pointer", fontFamily:"'Nunito Sans',sans-serif",
              borderBottom: page===p ? `2px solid ${tweaks.primaryColor}` : "2px solid transparent",
              transition:"all 0.15s"
            }}>{label}</button>
          ))}
        </div>

        {/* Right */}
        <div style={{ display:"flex", gap:10, alignItems:"center", flexShrink:0 }}>
          {loggedIn
            ? <>
                <button onClick={()=>setPage("dashboard")} style={{
                  background:"none", border:"none", fontWeight:600, fontSize:14,
                  color:"#555", cursor:"pointer", padding:"8px 12px",
                  borderRadius:8, fontFamily:"'Nunito Sans',sans-serif"

                <div style={{

                  display:"flex", alignItems:"center", justifyContent:"center",
                  color:"#fff", fontWeight:800, fontSize:14, cursor:"pointer",
                  fontFamily:"'Nunito',sans-serif"
                }} onClick={()=>setLoggedIn(false)}>M</div>
              </>
            : <>
                <Btn variant="ghost" onClick={()=>setPage("login")} color={tweaks.primaryColor} radius={tweaks.roundness}>Log ind</Btn>
                <Btn variant="primary" onClick={()=>setPage("signup")} color={tweaks.primaryColor} radius={tweaks.roundness * 0.7}>
                  Tilmeld institution
                </Btn>
              </>
          }
        </div>
      </div>
    </nav>
  );
}

// ─── SIGNUP PAGE ──────────────────────────────────────────────────────────────
function SignupPage({ setPage, setLoggedIn, tweaks }) {
  const [step, setStep] = useState(1);
  const [cvr, setCvr] = useState("");
  const [cvrStatus, setCvrStatus] = useState(null); // null | "checking" | "ok" | "err"
  const [cvrData, setCvrData] = useState(null);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [name, setName] = useState("");

  function checkCvr() {
    if (cvr.length !== 8) return;
    setCvrStatus("checking");
    setTimeout(() => {
      if (cvr === "00000000") {
        setCvrStatus("err");
      } else {
        setCvrStatus("ok");
        setCvrData({ name:"Solsikken Vuggestue & Børnehave", address:"Rosenvej 14, 8000 Aarhus", type:"Vuggestue/Børnehave" });
      }
    }, 1400);
  }

  function handleDone() {
    setLoggedIn(true);
    setPage("dashboard");
  }

  const steps = ["CVR-verificering","Opret konto","Færdig!"];

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"80px 24px", background:"linear-gradient(150deg,#fffcf8 0%,#f0f9f4 100%)" }}>
      <div style={{ width:"100%", maxWidth:520 }}>
        {/* Logo */}
        <div onClick={()=>setPage("home")} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer", marginBottom:32, justifyContent:"center" }}>
          <div style={{ width:40, height:40, borderRadius:12, background:tweaks.primaryColor, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>♻️</div>
          <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:22, letterSpacing:"-0.5px" }}>
            <span style={{ color:tweaks.primaryColor }}>Legetøjs</span>Byt
          </span>
        </div>

        {/* Steps indicator */}
        <div style={{ display:"flex", gap:0, marginBottom:32, background:"#fff", borderRadius:tweaks.roundness, padding:"6px", boxShadow:"0 2px 12px rgba(0,0,0,0.06)" }}>
          {steps.map((s,i) => (
            <div key={i} style={{
              flex:1, textAlign:"center", padding:"10px 8px",
              borderRadius:tweaks.roundness - 4,
              background: step===i+1 ? tweaks.primaryColor : "transparent",
              transition:"all 0.2s"
            }}>
              <div style={{ fontSize:12, fontWeight:700, fontFamily:"'Nunito',sans-serif", color:step===i+1?"#fff":step>i+1?tweaks.primaryColor:"#bbb" }}>
                {step > i+1 ? "✓ " : `${i+1}. `}{s}
              </div>
            </div>
          ))}
        </div>

        <div style={{ background:"#fff", borderRadius:tweaks.roundness * 1.5, padding:40, boxShadow:"0 8px 40px rgba(0,0,0,0.08)" }}>
          {/* Step 1: CVR */}
          {step === 1 && (
            <div>
              <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:26, marginBottom:8 }}>Verificér jeres institution</h2>
              <p style={{ color:"#888", fontSize:14, marginBottom:28 }}>Vi bruger CVR-nummeret til at bekræfte at I er en godkendt institution.</p>
              <div style={{ marginBottom:16 }}>
                <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>CVR-nummer (8 cifre)</label>
                <div style={{ display:"flex", gap:10 }}>
                  <input value={cvr} onChange={e=>setCvr(e.target.value.replace(/\D/g,"").slice(0,8))}
                    placeholder="12345678" maxLength={8}
                    style={{
                      flex:1, padding:"12px 14px", borderRadius:tweaks.roundness * 0.7,
                      border:"1.5px solid " + (cvrStatus==="err"?"#ef4444":cvrStatus==="ok"?"#2A7D4F":"#e5e5e5"),
                      fontSize:16, letterSpacing:2, fontFamily:"'Nunito',sans-serif",
                      fontWeight:700, outline:"none"
                    }} />
                  <Btn variant="primary" color={tweaks.primaryColor} radius={tweaks.roundness}
                    onClick={checkCvr} style={{ flexShrink:0 }}>
                    {cvrStatus==="checking" ? "Tjekker..." : "Tjek CVR"}
                  </Btn>
                </div>
              </div>

              {cvrStatus === "checking" && (
                <div style={{ background:"#f8f8f8", borderRadius:10, padding:"12px 16px", fontSize:13, color:"#888", display:"flex", gap:10 }}>
                  <span>⏳</span> Slår CVR op i Erhvervsstyrelsens register...
                </div>
              )}
              {cvrStatus === "err" && (
                <div style={{ background:"#FEF2F2", border:"1.5px solid #fca5a5", borderRadius:10, padding:"12px 16px", fontSize:13, color:"#b91c1c" }}>
                  ❌ CVR-nummeret er ikke fundet eller institutionen er ikke aktiv. Kontrollér nummeret.
                </div>
              )}
              {cvrStatus === "ok" && cvrData && (
                <div>
                  <div style={{ background:"#E8F5EE", border:"1.5px solid #a7d7b8", borderRadius:10, padding:"16px", marginBottom:20 }}>
                    <div style={{ display:"flex", gap:10, alignItems:"flex-start" }}>
                      <span style={{ fontSize:20 }}>✅</span>
                      <div>
                        <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:15, color:"#1a5c38", marginBottom:4 }}>Institution verificeret!</div>
                        <div style={{ fontSize:14, fontWeight:700 }}>{cvrData.name}</div>
                        <div style={{ fontSize:13, color:"#555", marginTop:2 }}>{cvrData.address}</div>
                        <div style={{ display:"inline-block", background:"#d1fae5", color:"#065f46", fontSize:11, fontWeight:700, borderRadius:6, padding:"2px 8px", marginTop:6 }}>{cvrData.type}</div>
                      </div>
                    </div>
                  </div>
                  <Btn variant="primary" color={tweaks.primaryColor} radius={tweaks.roundness}
                    onClick={()=>setStep(2)} style={{ justifyContent:"center", width:"100%", padding:"14px", fontSize:15 }}>
                    Fortsæt →
                  </Btn>
                </div>
              )}
              <div style={{ textAlign:"center", marginTop:20, fontSize:13, color:"#888" }}>
                Allerede tilmeldt? <a onClick={()=>setPage("login")} style={{ color:tweaks.primaryColor, fontWeight:700, cursor:"pointer" }}>Log ind</a>
              </div>
            </div>
          )}

          {/* Step 2: Account */}
          {step === 2 && (
            <div>
              <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:26, marginBottom:8 }}>Opret jeres konto</h2>
              <p style={{ color:"#888", fontSize:14, marginBottom:28 }}>Disse oplysninger bruges til at logge ind og kommunikere med andre institutioner.</p>
              <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                <div>
                  <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Kontaktpersonens navn</label>
                  <input value={name} onChange={e=>setName(e.target.value)} placeholder="Fornavn Efternavn"
                    style={{ width:"100%", padding:"12px 14px", borderRadius:tweaks.roundness * 0.7, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
                </div>
                <div>
                  <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>E-mail</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="navn@institution.dk"
                    style={{ width:"100%", padding:"12px 14px", borderRadius:tweaks.roundness * 0.7, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
                </div>
                <div>
                  <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Vælg kodeord</label>
                  <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Mindst 8 tegn"
                    style={{ width:"100%", padding:"12px 14px", borderRadius:tweaks.roundness * 0.7, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
                </div>
                <div style={{ background:"#f8f8f8", borderRadius:10, padding:"12px 14px", fontSize:12, color:"#888" }}>
                  🔒 Vi deler aldrig dine oplysninger med tredjeparter. Læs vores <a style={{ color:tweaks.primaryColor, fontWeight:600 }}>privatlivspolitik</a>.
                </div>
                <Btn variant="primary" color={tweaks.primaryColor} radius={tweaks.roundness}
                  onClick={()=>setStep(3)} style={{ justifyContent:"center", padding:"14px", fontSize:15 }}>
                  Opret institution →
                </Btn>
                <button onClick={()=>setStep(1)} style={{ background:"none", border:"none", color:"#888", fontSize:13, cursor:"pointer" }}>← Tilbage</button>
              </div>
            </div>
          )}

          {/* Step 3: Done */}
          {step === 3 && (
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:72, marginBottom:16 }}>🎉</div>
              <h2 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:28, marginBottom:10 }}>Velkommen til LegetøjsByt!</h2>
              <p style={{ color:"#888", fontSize:15, lineHeight:1.65, marginBottom:32 }}>
                Jeres institution er nu oprettet og verificeret. I kan straks begynde at browse og oprette opslag.
              </p>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <Btn variant="primary" color={tweaks.primaryColor} radius={tweaks.roundness}
                  onClick={handleDone} style={{ justifyContent:"center", padding:"14px", fontSize:15 }}>
                  Gå til min institution →
                </Btn>
                <Btn variant="outline" radius={tweaks.roundness}
                  onClick={()=>setPage("opslag")} style={{ justifyContent:"center", padding:"13px", fontSize:14 }}>
                  Browse opslag
                </Btn>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                }}>{EMOJIS[l.img]}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14 }}>{l.title}</div>
                  <div style={{ fontSize:12, color:"#888", marginTop:2 }}>{l.city} · {l.age}</div>
                </div>
                <Badge type={l.type} />
                <div style={{ fontSize:13, color:"#2A7D4F", fontWeight:700, fontFamily:"'Nunito',sans-serif" }}>
                  {l.price ? `${l.price} kr.` : l.bids ? `${l.bids} bud` : "Intet bud"}
                </div>
                <button style={{
                  background:"#f5f5f5", border:"none", borderRadius:8, padding:"6px 14px",
                  fontSize:12, fontWeight:600, cursor:"pointer"
                }}>Rediger</button>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* New listing modal */}
      <Modal open={newOpslagOpen} onClose={()=>{ setNewOpslagOpen(false); setOpslagStep(1); }} title={`Opret opslag — Trin ${opslagStep}/2`}>
        {opslagStep === 1 && (
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div>
              <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Titel</label>
              <input value={formData.title} onChange={e=>setFormData({...formData,title:e.target.value})}
                placeholder="Fx: LEGO Duplo stor kasse" style={{ width:"100%", padding:"11px 14px", borderRadius:10, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:8 }}>Handelsform</label>
              <div style={{ display:"flex", gap:8 }}>
                {["køb","byd","byt"].map(t => (
                  <button key={t} onClick={()=>setFormData({...formData,type:t})} style={{
                    flex:1, padding:"10px", borderRadius:10, border:"none",
                    background: formData.type===t ? TYPE_CFG[t].bg : "#f5f5f5",
                    color: formData.type===t ? TYPE_CFG[t].color : "#888",
                    fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:13,
                    border: formData.type===t ? `2px solid ${TYPE_CFG[t].color}` : "2px solid transparent"
                  }}>{TYPE_CFG[t].label}</button>
                ))}
              </div>
            </div>
            {formData.type === "køb" && (
              <div>
                <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Pris (kr.)</label>
                <input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})}
                  placeholder="Fx 250" style={{ width:"100%", padding:"11px 14px", borderRadius:10, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
              </div>
            )}
            <div>
              <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Aldersgruppe</label>
              <select value={formData.age} onChange={e=>setFormData({...formData,age:e.target.value})} style={{ width:"100%", padding:"11px 14px", borderRadius:10, border:"1.5px solid #e5e5e5", fontSize:14, fontFamily:"'Nunito Sans',sans-serif", outline:"none", background:"#fff" }}>
                {["0-1 år","1-3 år","3-6 år","6-10 år","10+ år"].map(a => <option key={a}>{a}</option>)}
              </select>
            </div>
            <Btn variant="primary" color={tweaks.primaryColor} radius={12}
              onClick={()=>setOpslagStep(2)} style={{ justifyContent:"center", padding:"13px", fontSize:14 }}>
              Næste →
            </Btn>
          </div>
        )}
        {opslagStep === 2 && (
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div>
              <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Beskrivelse</label>
              <textarea value={formData.desc} onChange={e=>setFormData({...formData,desc:e.target.value})}
                placeholder="Beskriv legetøjets stand, hvad der medfølger, eventuelle fejl..." rows={4}
                style={{ width:"100%", padding:"11px 14px", borderRadius:10, border:"1.5px solid #e5e5e5", fontSize:14, resize:"none", fontFamily:"'Nunito Sans',sans-serif", outline:"none" }} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:13, fontWeight:700, marginBottom:6 }}>Stand</label>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {["Ny","Meget god","God","Acceptabel"].map(c => (
                  <button key={c} onClick={()=>setFormData({...formData,condition:c})} style={{
                    padding:"8px 16px", borderRadius:99,
                    border: formData.condition===c ? `2px solid ${tweaks.primaryColor}` : "2px solid #e5e5e5",
                    background: formData.condition===c ? "#E8F5EE" : "#fff",
                    color: formData.condition===c ? tweaks.primaryColor : "#555",
                    fontSize:13, fontWeight:600, fontFamily:"'Nunito',sans-serif"
                  }}>{c}</button>
                ))}
              </div>
            </div>
            {/* Photo placeholder */}
            <div style={{
              border:"2px dashed #ddd", borderRadius:12, padding:"28px 20px",
              textAlign:"center", background:"#fafafa"
            }}>
              <div style={{ fontSize:36, marginBottom:8 }}>📸</div>
              <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>Tilføj billeder</div>
              <div style={{ fontSize:12, color:"#aaa" }}>Klik for at uploade (maks 10 billeder)</div>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={()=>setOpslagStep(1)} style={{ flex:1, padding:"13px", borderRadius:12, background:"#f5f5f5", border:"none", fontWeight:700, cursor:"pointer", fontFamily:"'Nunito',sans-serif" }}>← Tilbage</button>
              <Btn variant="primary" color={tweaks.primaryColor} radius={12}
                onClick={handleCreate} style={{ flex:2, justifyContent:"center", padding:"13px", fontSize:14 }}>
                Publicer opslag ✓
              </Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// ─── HOW IT WORKS PAGE ────────────────────────────────────────────────────────
function HowItWorksPage({ setPage, tweaks }) {
  return (
    <div style={{ minHeight:"100vh", paddingTop:80, background:"#fffcf8" }}>
      <div style={{ maxWidth:900, margin:"0 auto", padding:"60px 24px" }}>
        <div style={{ textAlign:"center", marginBottom:60 }}>
          <h1 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:42, letterSpacing:"-1px", marginBottom:12 }}>Sådan virker LegetøjsByt</h1>
          <p style={{ color:"#888", fontSize:18, lineHeight:1.65, maxWidth:560, margin:"0 auto" }}>
            En tryg markedsplads kun for verificerede institutioner
          </p>
        </div>
        {[
          { n:"01", icon:"🏢", color:"#E8F5EE", title:"Registrér jeres institution", desc:"Angiv jeres CVR-nummer — vi slår det automatisk op i Erhvervsstyrelsens register og bekræfter at I er en godkendt institution (vuggestue, børnehave, skole, SFO eller klub). Det tager under 30 sekunder." },
          { n:"02", icon:"📸", color:"#E8F0FB", title:"Opret et opslag", desc:"Beskriv legetøjet, tag billeder, og vælg om det skal sælges til fast pris, byder på auktion, eller byttes. Opslaget er synligt for alle verificerede institutioner i hele landet." },
          { n:"03", icon:"🤝", color:"#FEF0E3", title:"Kom i kontakt", desc:"Interesserede institutioner sender jer en besked, afgiver et bud eller foreslår et bytte. I modtager notifikationer på e-mail og kan svare direkte fra platformen." },
          { n:"04", icon:"🚚", color:"#E8F5EE", title:"Aftal afhentning", desc:"Aftaling sker direkte via vores beskedsystem. I vælger selv om I vil afhente, sende med pakkeprivat, eller bruge vores transportservice (kører faste ruter i Jylland og på Sjælland)." },
        ].map((s,i) => (
          <div key={i} style={{
            display:"flex", gap:28, marginBottom:32, alignItems:"flex-start",
            background:"#fff", borderRadius:tweaks.roundness * 1.2, padding:28,
            boxShadow:"0 2px 16px rgba(0,0,0,0.06)"
          }}>
            <div style={{
              width:64, height:64, borderRadius:tweaks.roundness, background:s.color,
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:32, flexShrink:0
            }}>{s.icon}</div>
            <div>
              <div style={{ fontSize:11, fontWeight:800, color:"#bbb", letterSpacing:2, marginBottom:6 }}>TRIN {s.n}</div>
              <h3 style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:20, marginBottom:8 }}>{s.title}</h3>
              <p style={{ color:"#666", lineHeight:1.75, fontSize:15 }}>{s.desc}</p>
            </div>
          </div>
        ))}
        <div style={{ textAlign:"center", marginTop:48 }}>
          <Btn variant="primary" color={tweaks.primaryColor} radius={tweaks.roundness}
            onClick={()=>setPage("signup")} style={{ fontSize:16, padding:"15px 40px" }}>
            Tilmeld institution gratis →
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ─── HOME PAGE ─────────────────────────────────────────────────────────────
function HomePage({ setPage, setActiveListing, tweaks }) {
  return (
    <>
      <HeroSection setPage={setPage} tweaks={tweaks} />
      <StatsBar tweaks={tweaks} />
      <HowItWorksSection tweaks={tweaks} />
      <TradeTypesSection tweaks={tweaks} setPage={setPage} />
      <ListingsPreview setPage={setPage} setActiveListing={setActiveListing} tweaks={tweaks} />
      <TrustSection setPage={setPage} tweaks={tweaks} />
      <FooterSection setPage={setPage} tweaks={tweaks} />
    </>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState("home");
  const [activeListing, setActiveListing] = useState(null);
  const [loggedIn, setLoggedIn] = useState(false);
  const [toast, setToast] = useState(null);

  function showToast(msg) { setToast(msg); }
  function navigate(p) {
    setPage(p);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  return (
    <div>
      <Nav page={page} setPage={navigate} tweaks={tweaks} loggedIn={loggedIn} setLoggedIn={setLoggedIn} />

      {page === "home" && <HomePage setPage={navigate} setActiveListing={setActiveListing} tweaks={tweaks} />}
      {page === "opslag" && <OpslagPage setPage={navigate} setActiveListing={setActiveListing} tweaks={tweaks} />}
      {page === "listing" && activeListing && <ListingDetailPage listing={activeListing} setPage={navigate} tweaks={tweaks} showToast={showToast} />}
      {page === "login" && <LoginPage setPage={navigate} setLoggedIn={setLoggedIn} tweaks={tweaks} />}
      {page === "signup" && <SignupPage setPage={navigate} setLoggedIn={setLoggedIn} tweaks={tweaks} />}
      {page === "dashboard" && <DashboardPage setPage={navigate} tweaks={tweaks} showToast={showToast} />}
      {page === "hvordan" && <HowItWorksPage setPage={navigate} tweaks={tweaks} />}

      {toast && <Toast msg={toast} onDone={()=>setToast(null)} />}

      <TweaksPanel>
        <TweakSection label="Farver">
          <TweakColor label="Primærfarve" value={tweaks.primaryColor} onChange={v=>setTweak("primaryColor",v)} />
          <TweakColor label="Accent (orange)" value={tweaks.accentColor} onChange={v=>setTweak("accentColor",v)} />
          <TweakColor label="Accent (blå)" value={tweaks.accentColor2} onChange={v=>setTweak("accentColor2",v)} />
        </TweakSection>
        <TweakSection label="Hero tekst">
          <TweakText label="Overskrift" value={tweaks.heroHeadline} onChange={v=>setTweak("heroHeadline",v)} />
          <TweakText label="Underoverskrift" value={tweaks.heroSub} onChange={v=>setTweak("heroSub",v)} />
        </TweakSection>
        <TweakSection label="Layout">
          <TweakSlider label="Hjørnerunding" value={tweaks.roundness} onChange={v=>setTweak("roundness",v)} min={4} max={32} step={2} />
          <TweakToggle label="Vis statistik-bar" value={tweaks.showStats} onChange={v=>setTweak("showStats",v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
