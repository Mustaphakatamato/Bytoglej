<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#F6F2EA"/>

  <!-- "byt" – top line, dark ink -->
  <text
    x="40" y="248"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="190"
    letter-spacing="-6"
    fill="#16221C">byt</text>

  <!-- "&" – bottom line, primary green -->
  <text
    x="40" y="462"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="190"
    fill="#2A7D4F">&amp;</text>

  <!-- "leg." – bottom line, dark ink -->
  <text
    x="155" y="462"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="190"
    letter-spacing="-4"
    fill="#16221C">leg.</text>
</svg>
