<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Byt&amp;Leg — Ingen forbindelse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F6F2EA;
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px 20px;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(22,34,28,0.10);
    }

    .icon {
      width: 80px;
      height: 80px;
      background: #E8F1EC;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #2A7D4F;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #16221C;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    p {
      font-size: 15px;
      color: #6B7570;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2A7D4F;
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }

    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: #6B7570;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2A7D4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <div class="brand">Byt&amp;Leg</div>
    <h1>Ingen internetforbindelse</h1>
    <p>
      Det ser ud til, at du ikke er forbundet til internettet lige nu.
      Tjek din forbindelse og prøv igen — dine gemte opslag er stadig tilgængelige.
    </p>

    <button onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Prøv igen
    </button>
  </div>

  <div class="footer">byt&amp;leg — giv legetøj nyt liv</div>
</body>
</html>
